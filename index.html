<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FALPD — Ferramenta de Análise de Literatura Portuguesa para Docentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{--or:#ff6a00;--or2:#ff8c3a;--ink:#1b120c;--bg:#fffaf5;--sf:#fff;--tx:#2a1a10;--mu:#7a6555;--bd:#f3dfcf;--dk:#1b120c;--dkt:#fff3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#150e09;--sf:#241a12;--tx:#fbeee2;--mu:#c2a994;--bd:#3d2c1f;--dk:#0d0804}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sora',system-ui,sans-serif;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
#root{display:flex;flex-direction:column;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:2px solid var(--or);display:flex;align-items:center;gap:20px;padding:10px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:1px;cursor:pointer;color:var(--tx)}.brand b{color:var(--or)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--mu);border-radius:8px;position:relative;transition:.2s}
nav a:hover{color:var(--or);background:rgba(255,106,0,.1)}nav a.on{color:#fff;background:var(--or)}
.btn{border:0;border-radius:10px;padding:10px 18px;font:600 14px 'Sora',sans-serif;cursor:pointer;background:var(--or);color:#fff;transition:.2s;box-shadow:0 3px 0 #c24e00}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(255,106,0,.4)}.btn:active{transform:translateY(1px);box-shadow:none}
.btn.g{background:transparent;color:var(--or);box-shadow:inset 0 0 0 2px var(--or)}.btn.g:hover{background:var(--or);color:#fff}
.btn.k{background:var(--dk);color:var(--dkt);box-shadow:0 3px 0 #000}.btn.s{padding:6px 12px;font-size:12px}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:28px 20px}
.hero{background:linear-gradient(135deg,var(--dk) 55%,#4a2108);color:var(--dkt);border-radius:24px;padding:48px 36px;display:flex;gap:30px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:var(--or);opacity:.25}
.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 10px;line-height:1.1;font-weight:800}.hero h1 span{color:var(--or2)}
.hero p{max-width:540px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:var(--or);box-shadow:0 12px 28px rgba(255,106,0,.18)}
.card h3{margin:6px 0;color:var(--or)}.ic{font-size:28px}
h2{font-size:26px;margin:0 0 4px}h2:after{content:"";display:block;width:56px;height:4px;background:var(--or);border-radius:4px;margin-top:6px}
.mu{color:var(--mu);font-size:14px}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:14px 'Sora',sans-serif;transition:.2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px rgba(255,106,0,.2)}
textarea{min-height:110px;resize:vertical}label{font-size:12px;font-weight:600;color:var(--mu);display:block;margin:12px 0 4px}
.drop{border:2px dashed var(--or);border-radius:16px;padding:26px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,106,0,.05)}
.drop:hover{background:rgba(255,106,0,.14);transform:scale(1.01)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}.row>.btn{flex:0 0 auto}
table{width:100%;border-collapse:collapse;margin-top:12px}th{background:var(--dk);color:var(--dkt);text-align:left;padding:10px;font-size:13px}
td{padding:8px;border-bottom:1px solid var(--bd)}tr:hover td{background:rgba(255,106,0,.07)}td input{padding:6px 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.pill{padding:6px 14px;border-radius:99px;border:1.5px solid var(--or);color:var(--or);font-weight:600;font-size:13px;cursor:pointer;transition:.2s}
.pill:hover,.pill.on{background:var(--or);color:#fff}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));transition:width .6s}
.score{font-size:54px;font-weight:800;color:var(--or);line-height:1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:2px solid var(--bd);transition:.2s}.thumbs img:hover{transform:scale(1.8);z-index:2;border-color:var(--or)}
video{width:100%;max-height:260px;border-radius:12px;background:#000;display:none}video.on{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.two{grid-template-columns:1fr}}
footer{background:var(--dk);color:var(--dkt);text-align:center;padding:18px;font-size:13px;border-top:4px solid var(--or)}
.note{background:rgba(255,106,0,.1);border-left:4px solid var(--or);padding:10px 14px;border-radius:8px;font-size:13px;margin:12px 0}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const AT={class:'className',autoplay:'autoPlay',playsinline:'playsInline'};
const ce=(t,p,...c)=>{if(p){const q={};for(const k in p)q[AT[k]||k]=p[k];if(typeof q.style==='string')q.style=Object.fromEntries(q.style.split(';').filter(s=>s.includes(':')).map(s=>{const[k,...v]=s.split(':');return[k.trim().replace(/-([a-z])/g,(_,x)=>x.toUpperCase()),v.join(':').trim()]}));p=q}return React.createElement(t,p,...c)};
const h=htm.bind(ce);
class EB extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?h`<main><div class="note">Ocorreu um erro: ${String(this.state.e.message||this.state.e)}</div><button class="btn" onClick=${()=>this.setState({e:null})}>Tentar de novo</button></main>`:this.props.children}}
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function usePersist(k,d){const[s,set]=useState(()=>ld(k,d));useEffect(()=>{const id=setTimeout(()=>sv(k,s),400);return()=>clearTimeout(id)},[s]);return[s,set]}

/* ===== Motor FALPD: extração de padrões + classificador logístico com aprendizagem online (sem LLM) ===== */
const STOP=new Set('que uma uns umas dos das nos nas por para com como mas aos foi ser sao ele ela seu sua lhe mais ja tambem pelo pela isso este esta esse essa entre sobre'.split(' '));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const tok=s=>(norm(s).match(/[a-z]{3,}/g)||[]).filter(w=>!STOP.has(w)).map(w=>w.slice(0,6));
const tf=a=>{const m={};a.forEach(w=>m[w]=(m[w]||0)+1);return m};
const cos=(a,b)=>{let d=0,x=0,y=0;for(const k in a){x+=a[k]*a[k];if(b[k])d+=a[k]*b[k]}for(const k in b)y+=b[k]*b[k];return x&&y?d/Math.sqrt(x*y):0};
const topSet=(t,n)=>{const f=tf(tok(t));return new Set(Object.keys(f).sort((a,b)=>f[b]-f[a]).slice(0,n))};
const RES=['metafora','ironia','comparacao','personificacao','hiperbole','antitese','enumeracao','anafora','aliteracao','sinestesia','adjetivacao','apostrofe','simbolo','eufemismo','paradoxo','oximoro','gradacao','alegoria','retorica','assindeto','polissindeto','ceticismo','sebastianismo'];
const INF=['sugere','simboliza','revela','evidencia','transmite','remete','denuncia','implicito','subentend','critica','reflete','representa','demonstra'];
const FN=['Semelhança com a resposta-modelo','Cobertura dos conceitos-chave','Alinhamento com o contexto da obra','Alinhamento com os critérios','Recursos expressivos identificados','Extensão adequada','Interpretação do subentendido'];
const W0={w:[2.2,2.4,.8,.5,.7,.8,.6],b:-2.6,n:0},LR=.5;
const sig=z=>1/(1+Math.exp(-z));
const pred=(m,x)=>sig(m.b+x.reduce((s,v,i)=>s+v*m.w[i],0));
const hits=(a,l)=>l.filter(w=>a.includes(w)).length;
function feats(ans,ref,ctx,crit){
  const ta=tok(ans),tr=tok(ref);if(!ta.length)return FN.map(()=>0);
  const sa=new Set(ta),sr=new Set(tr),na=norm(ans);
  const ov=(S)=>S.size?[...sa].filter(w=>S.has(w)).length/sa.size:0;
  return[cos(tf(ta),tf(tr)),sr.size?[...sr].filter(w=>sa.has(w)).length/sr.size:0,ov(topSet(ctx,400)),ov(topSet(crit,300)),Math.min(hits(na,RES),3)/3,Math.min(ta.length/Math.max(tr.length,1),1),Math.min(hits(na,INF),3)/3];
}
const train=(m,x,y)=>{const e=y-pred(m,x);return{w:m.w.map((w,i)=>w+LR*e*x[i]),b:m.b+LR*e,n:m.n+1}};

async function pdfText(f){const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=d.numPages;i++){const p=await(await d.getPage(i)).getTextContent();t+=p.items.map(x=>x.str).join(' ')+'\n'}return t}

/* ===== UI ===== */
const Logo=({s=40})=>h`<svg width=${s} height=${s} viewBox="0 0 64 64" role="img" aria-label="Livro aberto com rede de padrões">
<path d="M6 18Q22 11 32 20Q42 11 58 18V52Q42 45 32 54Q22 45 6 52Z" fill="#ff6a00"/>
<path d="M32 20V54" stroke="#fff" stroke-width="2"/>
<g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M14 30L22 38L26 28M22 38L26 46M38 28L46 36L52 28M46 36L42 46"/></g>
<g fill="#1b120c" stroke="#fff" stroke-width="1.5"><circle cx="14" cy="30" r="3"/><circle cx="22" cy="38" r="3"/><circle cx="26" cy="28" r="3"/><circle cx="26" cy="46" r="3"/><circle cx="38" cy="28" r="3"/><circle cx="46" cy="36" r="3"/><circle cx="52" cy="28" r="3"/><circle cx="42" cy="46" r="3"/></g>
<path d="M40 6l3 5 5 1-4 4 1 5-5-3-5 3 1-5-4-4 5-1z" fill="#ff6a00" stroke="#1b120c" stroke-width="1.5" transform="translate(-3 -2) scale(.8)"/></svg>`;

const PAGES=[['inicio','Início'],['dash','Dashboard'],['crit','Critérios'],['tests','Testes/Exames'],['corr','Correção']];

function Upload({title,desc,items,multi,onAdd,onDel}){
  const[busy,setBusy]=useState(false),[err,setErr]=useState('');const r=useRef();
  const go=async e=>{setBusy(true);setErr('');try{for(const f of e.target.files){onAdd({name:f.name,text:(await pdfText(f)).slice(0,300000)})}}catch(x){setErr('Não foi possível ler o PDF (pode ser uma digitalização sem texto).')}setBusy(false);e.target.value=''};
  return h`<div><h2>${title}</h2><p class="mu">${desc}</p>
  <div class="drop" onClick=${()=>r.current.click()}><div class="ic">📄</div><b>${busy?'A ler PDF…':'Clica para carregar PDF'+(multi?'s':'')}</b><input ref=${r} type="file" accept="application/pdf" multiple=${multi} hidden onChange=${go}/></div>
  ${err&&h`<div class="note">${err}</div>`}
  <div class="grid">${items.map((d,i)=>h`<div class="card" key=${i}><b>${d.name}</b><p class="mu">${d.text.length.toLocaleString('pt-PT')} caracteres lidos</p><p class="mu">${d.text.slice(0,160)}…</p><button class="btn g s" onClick=${()=>onDel(i)}>Remover</button></div>`)}</div></div>`;
}

function Home({go,m}){return h`<div><section class="hero"><${Logo} s=${110}/><div><h1>Corrige literatura <span>com padrões</span>, não com palpites.</h1>
<p>A FALPD lê os teus critérios e as obras do autor, mede cada resposta em sete parâmetros e atribui cotação. Cada feedback teu ensina o motor a ser mais exato — sem recorrer a qualquer IA externa.</p>
<div class="row"><button class="btn" onClick=${()=>go('corr')}>Começar a corrigir</button><button class="btn g" onClick=${()=>go('dash')}>Ver turmas</button></div></div></section>
<div class="grid">${[['📋','Critérios','Carrega o PDF dos critérios do ano corrente.'],['📚','Contexto por teste','Em cada teste, PDFs do autor: estilo, recursos e subentendidos. Reutilizáveis entre testes do mesmo autor.'],['📝','Testes/Exames','Cada teste tem turma associada e média da turma.'],['🧩','Teste por grupos','O PDF do teste é separado em grupos e questões, cada uma com resposta-modelo.'],['🧠','Aprendizagem','Motor com '+m.n+' feedback(s) acumulado(s).'],['🏫','Turmas','Alunos e notas num dashboard.']].map(([i,t,d])=>h`<div class="card" key=${t}><div class="ic">${i}</div><h3>${t}</h3><span class="mu">${d}</span></div>`)}</div></div>`}

function Dash({cls,setCls}){
  const[ci,setCi]=useState(0),[nm,setNm]=useState(''),[cn,setCn]=useState('');const c=cls[ci]||cls[0];
  const upd=f=>setCls(cls.map((x,i)=>i===ci?f(x):x));
  const sts=c?c.students:[];const ns=sts.filter(s=>s.nota!=null&&s.nota!=='');const avg=ns.length?(ns.reduce((a,s)=>a+ +s.nota,0)/ns.length).toFixed(1):'—';
  return h`<div><h2>Dashboard de turmas</h2><p class="mu">Nota do último teste de literatura portuguesa, atribuída pela FALPD (0–20).</p>
  <div class="tabs">${cls.map((x,i)=>h`<span key=${x.id} class=${'pill'+(i===ci?' on':'')} onClick=${()=>setCi(i)}>${x.name}</span>`)}</div>
  <div class="row"><input placeholder="Nova turma (ex.: 12.º B)" value=${cn} onInput=${e=>setCn(e.target.value)}/><button class="btn g" onClick=${()=>{if(cn.trim()){setCls([...cls,{id:Date.now(),name:cn.trim(),students:[]}]);setCi(cls.length);setCn('')}}}>+ Turma</button>
  ${c&&cls.length>1&&h`<button class="btn k" onClick=${()=>{setCls(cls.filter((_,i)=>i!==ci));setCi(0)}}>Remover turma</button>`}</div>
  ${c&&h`<div class="card" style="margin-top:16px"><div class="row"><b>${c.name} · ${sts.length} aluno(s)</b><span class="mu">Média: <b style="color:var(--or)">${avg}</b></span></div>
  <table><tr><th>Aluno</th><th style="width:130px">Nota</th><th style="width:90px"></th></tr>
  ${sts.map(s=>h`<tr key=${s.id}><td><input value=${s.name} onInput=${e=>upd(x=>({...x,students:x.students.map(y=>y.id===s.id?{...y,name:e.target.value}:y)}))}/></td>
  <td><input type="number" min="0" max="20" step="0.1" value=${s.nota??''} onInput=${e=>upd(x=>({...x,students:x.students.map(y=>y.id===s.id?{...y,nota:e.target.value}:y)}))}/></td>
  <td><button class="btn k s" onClick=${()=>upd(x=>({...x,students:x.students.filter(y=>y.id!==s.id)}))}>Remover</button></td></tr>`)}</table>
  <div class="row" style="margin-top:12px"><input placeholder="Nome do novo aluno" value=${nm} onInput=${e=>setNm(e.target.value)}/><button class="btn" onClick=${()=>{if(nm.trim()){upd(x=>({...x,students:[...x.students,{id:Date.now(),name:nm.trim(),nota:null}]}));setNm('')}}}>+ Aluno</button></div></div>`}</div>`;
}

const ctxOf=(t,all)=>[...t.ctx,...(t.reuse?all.filter(o=>o.id!==t.id&&norm(o.author)===norm(t.author)).flatMap(o=>o.ctx):[])].map(d=>d.text).join(' ');
const gn=g=>g.m?g.p/g.m*20:0;

function FilePick({label,multi,items,onAdd,onDel}){
  const[busy,setBusy]=useState(false),[err,setErr]=useState('');
  const go=async e=>{setBusy(true);setErr('');try{for(const f of e.target.files)onAdd({name:f.name,text:(await pdfText(f)).slice(0,150000)})}catch(x){setErr('Não foi possível ler o PDF.')}setBusy(false);e.target.value=''};
  return h`<div><label>${label}</label><input type="file" accept="application/pdf" multiple=${multi} onChange=${go}/>${busy&&h`<span class="mu">A ler PDF…</span>`}${err&&h`<span class="mu">${err}</span>`}
  <div class="thumbs">${items.map((d,i)=>h`<span class="pill" key=${i} title="Remover" onClick=${()=>onDel(i)}>${d.name} ✕</span>`)}</div></div>`;
}

function NewTest({cls,tests,onCreate}){
  const[n,setN]=useState(''),[ci,setCi]=useState(cls[0]?cls[0].id:0),[au,setAu]=useState(''),[cx,setCx]=useState([]),[tp,setTp]=useState([]),[re,setRe]=useState(true);
  const authors=[...new Set(tests.map(t=>t.author).filter(Boolean))];
  const prev=au.trim()?tests.filter(t=>norm(t.author)===norm(au)).reduce((a,t)=>a+t.ctx.length,0):0;
  const ok=n.trim()&&cls.length;
  return h`<div class="card"><h3>Novo teste</h3>
  <div class="row"><div><label>Nome do teste</label><input value=${n} onInput=${e=>setN(e.target.value)} placeholder="Ex.: Teste 2 — Os Lusíadas"/></div>
  <div><label>Turma associada</label><select value=${ci} onChange=${e=>setCi(+e.target.value)}>${cls.map(k=>h`<option key=${k.id} value=${k.id}>${k.name}</option>`)}</select></div>
  <div><label>Autor</label><input list="aut" value=${au} onInput=${e=>setAu(e.target.value)} placeholder="Ex.: Luís de Camões"/><datalist id="aut">${authors.map(a=>h`<option key=${a} value=${a}/>`)}</datalist></div></div>
  <${FilePick} label="PDF do teste/exame (opcional)" items=${tp} onAdd=${d=>setTp([d])} onDel=${()=>setTp([])}/>
  <${FilePick} label="Contexto: PDFs de obras do autor (estilo, recursos expressivos, subentendidos)" multi=${true} items=${cx} onAdd=${d=>setCx(o=>[...o,d])} onDel=${i=>setCx(o=>o.filter((_,j)=>j!==i))}/>
  ${prev>0&&h`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" checked=${re} onChange=${e=>setRe(e.target.checked)}/>Reutilizar ${prev} PDF(s) de contexto de testes anteriores de ${au.trim()}</label>`}
  ${!cls.length&&h`<div class="note">Cria primeiro uma turma no Dashboard.</div>`}
  <div style="margin-top:14px"><button class="btn" disabled=${!ok} onClick=${()=>onCreate({id:Date.now(),name:n.trim(),classId:ci,author:au.trim(),ctx:cx,paper:tp[0]||null,groups:tp[0]?parseTest(tp[0].text):[],answers:{},reuse:re,grades:{},date:new Date().toLocaleDateString('pt-PT')})}>Criar teste e começar a corrigir</button></div></div>`;
}

function parseTest(raw){
  const T=raw.replace(/\s+/g,' ').trim();
  const heads=T.split(/(?=\bGRUPO\s+[IVX]+\b)/).filter(p=>/^GRUPO\s+[IVX]+/.test(p));
  let n=0;
  return(heads.length?heads:[T]).map((p,gi)=>{
    const hm=p.match(/^GRUPO\s+[IVX]+/),body=hm?p.slice(hm[0].length):p;
    const re=/(?:^|\s)(\d{1,2}(?:\.\d{1,2})?)\.\s+(?=[A-ZÀ-Ú«“"])/g,mk=[];let r;
    while((r=re.exec(body)))mk.push({i:r.index,l:r[1],e:re.lastIndex});
    const qs=mk.map((k,i)=>{const tx=body.slice(k.e,i+1<mk.length?mk[i+1].i:body.length).trim(),pm=tx.match(/(\d{1,3})\s*(?:pontos|pts)/i);return{id:'q'+(++n),label:k.l,text:tx,max:pm?+pm[1]:10,model:''}});
    return{id:'g'+gi,name:hm?hm[0].replace(/\s+/,' '):'Teste',intro:(mk.length?body.slice(0,mk[0].i):body).trim(),qs};
  });
}

function Correct({cls,setCls,crit,m,setM,tests,setTests,tid,setTid}){
  const t=tests.find(x=>x.id===tid);
  const[si,setSi]=useState(''),[ed,setEd]=useState(false),[rs,setRs]=useState({}),[saved,setSaved]=useState(false);
  const c=t&&cls.find(k=>k.id===t.classId),ctx=t?ctxOf(t,tests):'',G=(t&&t.groups)||[];
  const extra=t&&t.reuse?tests.filter(o=>o.id!==t.id&&norm(o.author)===norm(t.author)).reduce((a,o)=>a+o.ctx.length,0):0;
  const upT=f=>setTests(tests.map(o=>o.id===t.id?f(o):o));
  const upG=(gid,p)=>upT(o=>({...o,groups:o.groups.map(g=>g.id===gid?{...g,...p}:g)}));
  const upQ=(gid,qid,p)=>upT(o=>({...o,groups:o.groups.map(g=>g.id===gid?{...g,qs:g.qs.map(q=>q.id===qid?{...q,...p}:q)}:g)}));
  const ans=qid=>((t.answers||{})[si]||{})[qid]||'';
  const setAns=(qid,v)=>upT(o=>({...o,answers:{...(o.answers||{}),[si]:{...((o.answers||{})[si]||{}),[qid]:v}}}));
  const pick=v=>{setSi(v);setRs({});setSaved(false)};
  const run=()=>{const r={};G.forEach(g=>g.qs.forEach(q=>{const a=ans(q.id);if(q.model&&q.model.trim()&&a.trim()){const x=feats(a,q.model,ctx+' '+g.intro,crit),p=pred(m,x);r[q.id]={x,p,score:Math.round(p*q.max*2)/2,fb:null}}}));setRs(r);setSaved(false)};
  const fb=(qid,y)=>{setM(train(m,rs[qid].x,y));setRs({...rs,[qid]:{...rs[qid],fb:y}})};
  const ev=G.flatMap(g=>g.qs).filter(q=>rs[q.id]),P=ev.reduce((a,q)=>a+rs[q.id].score,0),M=ev.reduce((a,q)=>a+q.max,0);
  const save=()=>{const nt=(P/M*20).toFixed(1);setCls(cls.map(k=>k.id===t.classId?{...k,students:k.students.map(s=>String(s.id)===si?{...s,nota:nt}:s)}:k));upT(o=>({...o,grades:{...o.grades,[si]:{p:P,m:M}}}));setSaved(true)};
  const newQ=g=>upG(g.id,{qs:[...g.qs,{id:'q'+Date.now(),label:String(g.qs.length+1),text:'',max:10,model:''}]});
  return h`<div><h2>Correção</h2><p class="mu">Cria um teste a partir do PDF: a FALPD separa os grupos e as questões. Escreve uma vez a resposta-modelo de cada questão e, aluno a aluno, cola ou escreve as respostas.</p>
  <div class="tabs">${tests.map(x=>h`<span key=${x.id} class=${'pill'+(x.id===tid?' on':'')} onClick=${()=>{setTid(x.id);pick('')}}>${x.name}</span>`)}<span class=${'pill'+(!t?' on':'')} onClick=${()=>setTid(null)}>+ Novo teste</span></div>
  ${!t?h`<${NewTest} cls=${cls} tests=${tests} onCreate=${x=>{setTests([...tests,x]);setTid(x.id)}}/>`:h`<div>
  <div class="note"><b>${t.name}</b> · ${c?c.name:'turma removida'} · ${t.author||'sem autor'} · contexto: ${t.ctx.length} PDF(s)${extra>0?' + '+extra+' reutilizado(s)':''}</div>
  ${!crit&&h`<div class="note">Sem critérios carregados (menu Critérios) a precisão desce.</div>`}
  <div class="card"><div class="row"><div><label>Aluno</label><select value=${si} onChange=${e=>pick(e.target.value)}><option value="">— escolhe —</option>${(c?c.students:[]).map(s=>h`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select></div>
  <button class="btn" disabled=${!si||!G.length} onClick=${run}>Avaliar teste</button>
  <button class="btn g" onClick=${()=>setEd(!ed)}>${ed?'Concluir edição':'Editar estrutura'}</button>
  ${t.paper&&!G.length&&h`<button class="btn k" onClick=${()=>upT(o=>({...o,groups:parseTest(o.paper.text)}))}>Separar questões do PDF</button>`}</div>
  ${ev.length>0&&h`<div class="row" style="margin-top:12px"><div><span class="score">${(P/M*20).toFixed(1)}</span><span class="mu"> / 20 · ${P}/${M} pts</span></div><button class="btn" disabled=${saved} onClick=${save}>${saved?'Nota guardada':'Guardar nota do aluno'}</button></div>`}</div>
  ${!G.length&&h`<div class="note">Sem questões. ${t.paper?'Carrega em "Separar questões do PDF" (só funciona com PDFs com texto, não digitalizações).':'Este teste não tem PDF: usa "Editar estrutura" para criar grupos e questões.'}</div>`}
  ${G.map(g=>h`<div key=${g.id} style="margin-top:22px">${ed?h`<div class="row"><input value=${g.name} onInput=${e=>upG(g.id,{name:e.target.value})}/><button class="btn k s" onClick=${()=>upT(o=>({...o,groups:o.groups.filter(x=>x.id!==g.id)}))}>Remover grupo</button></div>`:h`<h3 style="color:var(--or)">${g.name}</h3>`}
  ${(g.intro||ed)&&h`<details><summary class="mu">Texto / enunciado do grupo</summary>${ed?h`<textarea value=${g.intro} onInput=${e=>upG(g.id,{intro:e.target.value})}></textarea>`:h`<div class="mu" style="white-space:pre-wrap">${g.intro}</div>`}</details>`}
  ${g.qs.map(q=>{const r=rs[q.id];return h`<div class="card" key=${q.id} style="margin-top:12px"><div class="row">${ed?h`<input value=${q.label} onInput=${e=>upQ(g.id,q.id,{label:e.target.value})} style="max-width:80px"/>`:h`<b style="flex:0 0 auto">Questão ${q.label}</b>`}
  <div style="max-width:120px"><input type="number" min="1" title="Cotação" value=${q.max} onInput=${e=>upQ(g.id,q.id,{max:+e.target.value||1})}/></div><span class="mu" style="flex:0 0 auto">pontos</span>
  ${ed&&h`<button class="btn k s" onClick=${()=>upG(g.id,{qs:g.qs.filter(x=>x.id!==q.id)})}>Remover</button>`}</div>
  ${ed?h`<textarea value=${q.text} onInput=${e=>upQ(g.id,q.id,{text:e.target.value})}></textarea>`:h`<div style="white-space:pre-wrap;margin:8px 0">${q.text}</div>`}
  <div class="two"><div><label>Resposta-modelo (igual para todos os alunos)</label><textarea value=${q.model} onInput=${e=>upQ(g.id,q.id,{model:e.target.value})}></textarea></div>
  <div><label>Resposta do aluno</label>${si?h`<textarea value=${ans(q.id)} onInput=${e=>setAns(q.id,e.target.value)}></textarea>`:h`<div class="note">Escolhe um aluno.</div>`}</div></div>
  ${r&&h`<div class="row" style="margin-top:10px"><span class="score" style="font-size:28px">${r.score}/${q.max}</span><span class="mu">confiança ${(r.p*100).toFixed(0)}%</span>${r.fb==null?h`<button class="btn s" onClick=${()=>fb(q.id,1)}>✔ Correta</button><button class="btn k s" onClick=${()=>fb(q.id,0)}>✘ Incorreta</button>`:h`<span class="mu">Feedback registado (${m.n} no total)</span>`}</div>`}</div>`})}
  ${ed&&h`<div style="margin-top:10px"><button class="btn g s" onClick=${()=>newQ(g)}>+ Questão</button></div>`}</div>`)}
  ${ed&&h`<div style="margin-top:16px"><button class="btn g" onClick=${()=>upT(o=>({...o,groups:[...(o.groups||[]),{id:'g'+Date.now(),name:'Grupo',intro:'',qs:[]}]}))}>+ Grupo</button></div>`}</div>`}</div>`;
}

function Tests({tests,setTests,cls,setTid,go}){
  return h`<div><h2>Testes / Exames</h2><p class="mu">Os testes criados em Correção aparecem aqui, com a turma associada e a média da turma (0–20).</p>
  ${!tests.length&&h`<div class="note">Ainda não há testes.</div><button class="btn" onClick=${()=>go('corr')}>Criar o primeiro teste</button>`}
  <div class="grid">${tests.map(t=>{const c=cls.find(k=>k.id===t.classId),gs=Object.entries(t.grades),avg=gs.length?(gs.reduce((a,[,g])=>a+gn(g),0)/gs.length).toFixed(1):'—';
  return h`<div class="card" key=${t.id}><h3>${t.name}</h3><p class="mu">${c?c.name:'Turma removida'} · ${t.author||'sem autor'} · ${t.date}</p>
  <div class="score">${avg}</div><span class="mu">média da turma · ${gs.length}/${c?c.students.length:0} corrigidos</span>
  <table>${gs.map(([sid,g])=>{const s=c&&c.students.find(x=>String(x.id)===sid);return h`<tr key=${sid}><td>${s?s.name:'—'}</td><td>${gn(g).toFixed(1)}</td></tr>`})}</table>
  <div class="row" style="margin-top:10px"><button class="btn s" onClick=${()=>{setTid(t.id);go('corr')}}>Corrigir</button><button class="btn k s" onClick=${()=>setTests(tests.filter(o=>o.id!==t.id))}>Remover</button></div></div>`})}</div></div>`;
}

function App(){
  const[pg,setPg]=useState('inicio'),[tid,setTid]=useState(null);
  const[cls,setCls]=usePersist('phalpd_cls',[{id:1,name:'12.º A',students:[]}]);
  const[m,setM]=usePersist('phalpd_model',W0);
  const[docs,setDocs]=usePersist('phalpd_docs',{crit:[]});
  const[tests,setTests]=usePersist('phalpd_tests',[]);
  const crit=docs.crit||[];
  return h`<${React.Fragment}><header><div class="brand" onClick=${()=>setPg('inicio')}><${Logo}/><span>F<b>ALPD</b></span></div>
  <nav>${PAGES.map(([k,t])=>h`<a key=${k} class=${pg===k?'on':''} onClick=${()=>setPg(k)}>${t}</a>`)}</nav>
  <button class="btn g s" onClick=${()=>{}}>Iniciar sessão / Criar conta</button></header>
  <main>${pg==='inicio'?h`<${Home} go=${setPg} m=${m}/>`:pg==='dash'?h`<${Dash} cls=${cls} setCls=${setCls}/>`:pg==='crit'?h`<${Upload} title="Critérios de avaliação" desc="Carrega o PDF dos critérios da disciplina do ano corrente." multi=${false} items=${crit} onAdd=${d=>setDocs(o=>({...o,crit:[d]}))} onDel=${i=>setDocs(o=>({...o,crit:(o.crit||[]).filter((_,j)=>j!==i)}))}/>`:pg==='tests'?h`<${Tests} tests=${tests} setTests=${setTests} cls=${cls} setTid=${setTid} go=${setPg}/>`:h`<${Correct} cls=${cls} setCls=${setCls} crit=${crit.map(d=>d.text).join(' ')} m=${m} setM=${setM} tests=${tests} setTests=${setTests} tid=${tid} setTid=${setTid}/>`}</main>
  <footer>© 2026 FALPD — Ferramenta de Análise de Literatura Portuguesa para Docentes. Todos os direitos reservados.</footer><//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(h`<${EB}><${App}/><//>`);
</script>
</body>
</html>
