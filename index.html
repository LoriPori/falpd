<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">
<title>FALPD — Ferramenta de Análise de Literatura Portuguesa para Docentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{--or:#ff6a00;--or2:#ff8c3a;--ord:#c24e00;--ort:#b84700;--onor:#1b120c;--bg:#fffaf5;--sf:#fff;--sf2:#fff4ea;--tx:#2a1a10;--mu:#7a6555;--bd:#f3dfcf;--dk:#1b120c;--dkt:#fff3e8;--ok:#14804a;--okb:rgba(20,128,74,.12);--er:#c62d26;--erb:rgba(198,45,38,.1);--wn:#8a5200;--wnb:rgba(255,170,0,.2);--sh:0 1px 2px rgba(60,30,10,.05),0 10px 28px rgba(60,30,10,.06);--hh:62px;--ease:cubic-bezier(.22,1,.36,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#150e09;--sf:#241a12;--sf2:#2d2118;--tx:#fbeee2;--mu:#c2a994;--bd:#3d2c1f;--dk:#0d0804;--ort:#ff9a55;--ok:#4cd08a;--okb:rgba(76,208,138,.14);--er:#ff8a82;--erb:rgba(255,122,114,.14);--wn:#ffc15a;--wnb:rgba(255,193,90,.14);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 110px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#root{min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.2}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.mu{color:var(--mu);font-size:14px}
.ico{flex:0 0 auto;vertical-align:middle}

/* ===== Animações suaves e modernas ===== */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes floatSlow{0%,100%{transform:rotate(1.5deg) translateY(0)}50%{transform:rotate(1deg) translateY(-6px)}}
@keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.page-anim{animation:fadeSlideUp .42s var(--ease) both}
.sec,.card,.step,.stat,.q{animation:fadeSlideUp .38s var(--ease) both;transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease)}
.card:hover,.step:hover,.stat:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(60,30,10,.1)}
.grid>.card:nth-child(1),.steps>.step:nth-child(1){animation-delay:.03s}
.grid>.card:nth-child(2),.steps>.step:nth-child(2){animation-delay:.07s}
.grid>.card:nth-child(3),.steps>.step:nth-child(3){animation-delay:.11s}
.grid>.card:nth-child(4),.steps>.step:nth-child(4){animation-delay:.15s}
.grid>.card:nth-child(5){animation-delay:.19s}
.grid>.card:nth-child(6){animation-delay:.23s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* cabeçalho + navegação */
.top{position:sticky;top:0;z-index:20;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) clamp(14px,3vw,28px) 0;background:var(--sf);box-shadow:0 2px 0 var(--or);display:flex;align-items:center;gap:14px;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:1px;cursor:pointer;color:var(--tx);background:none;border:0;padding:0;transition:transform .2s var(--ease)}.brand:hover{transform:scale(1.02)}.brand b{color:var(--or)}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--mu);font:600 14px 'Sora',sans-serif;padding:9px 14px;border-radius:10px;cursor:pointer;transition:all .2s var(--ease)}
.nav button:hover{color:var(--ort);background:rgba(255,106,0,.1);transform:translateY(-1px)}
.nav button[aria-current=page]{background:var(--or);color:var(--onor);box-shadow:0 2px 8px rgba(255,106,0,.28)}
.auth-btn{margin-left:6px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--or);background:var(--sf2);color:var(--ort);font:600 13px 'Sora',sans-serif;padding:8px 14px;border-radius:99px;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.auth-btn:hover{background:var(--or);color:var(--onor);transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,106,0,.25)}
.auth-btn.on{background:var(--dk);color:var(--dkt);border-color:var(--dk)}
.wrap{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:28px clamp(14px,3vw,24px) 56px}
@media(max-width:860px){
.nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:30;justify-content:space-around;gap:0;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 4px}
.auth-btn{margin-left:auto;font-size:12px;padding:6px 12px}
.wrap{padding-bottom:100px}
}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;font:600 14px 'Sora',sans-serif;cursor:pointer;background:var(--or);color:var(--onor);box-shadow:0 3px 0 var(--ord);transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 var(--ord),0 8px 18px rgba(255,106,0,.3)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:transparent;color:var(--ort);box-shadow:inset 0 0 0 2px var(--or)}
.btn.g:hover:not(:disabled){background:var(--or);color:var(--onor);box-shadow:inset 0 0 0 2px var(--or)}
.btn.k{background:var(--dk);color:var(--dkt);box-shadow:0 3px 0 #000,inset 0 0 0 1px var(--bd)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 3px 0 #0c5630}
.btn.s{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.lg{padding:14px 26px;font-size:16px;border-radius:12px}
.ibtn{border:0;background:none;color:var(--mu);width:34px;height:34px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;transition:.15s}
.ibtn:hover{background:var(--erb);color:var(--er);transform:scale(1.08)}
.lnk{border:0;background:none;color:var(--ort);font:600 13px 'Sora',sans-serif;cursor:pointer;padding:4px 0;text-decoration:underline}

/* títulos de página e secções */
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.01em}
.ph p{margin-top:6px;max-width:62ch}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ort);margin-bottom:6px}
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-top:16px;box-shadow:var(--sh)}
.sec h3{font-size:17px}
.sh{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.sh p{margin-top:2px}
.sn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--dk);color:var(--dkt);display:grid;place-items:center;font-weight:800;font-size:14px}
.land h2{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.01em}
.land .blk{margin-top:56px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.card h3{font-size:16px;margin:10px 0 4px}
.fic{width:42px;height:42px;border-radius:12px;background:rgba(255,106,0,.14);color:var(--ort);display:grid;place-items:center}

/* chips e notas */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu);border:1px solid var(--bd);white-space:nowrap;transition:transform .15s}
.chip.ok{background:var(--okb);color:var(--ok);border-color:transparent}
.chip.err{background:var(--erb);color:var(--er);border-color:transparent}
.chip.warn{background:var(--wnb);color:var(--wn);border-color:transparent}
.chip.or{background:rgba(255,106,0,.14);color:var(--ort);border-color:transparent}
.note{background:rgba(255,106,0,.1);border-left:4px solid var(--or);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px;animation:scaleIn .25s var(--ease)}
.note.ok{background:var(--okb);border-color:var(--ok)}
.note.err{background:var(--erb);border-color:var(--er)}
.note.warn{background:var(--wnb);border-color:var(--wn)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;background:linear-gradient(135deg,var(--dk) 55%,#4a2108);color:var(--dkt);border-radius:28px;padding:clamp(28px,5vw,56px);position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(27,18,12,.22)}
.hero:after{content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;background:var(--or);opacity:.22;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(30px,5vw,50px);font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--or2)}
.hero .lead{font-size:17px;opacity:.88;max-width:50ch;margin:16px 0 26px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.g{color:var(--dkt);box-shadow:inset 0 0 0 2px rgba(255,243,232,.45)}
.hero .btn.g:hover{background:rgba(255,243,232,.14);color:var(--dkt);box-shadow:inset 0 0 0 2px var(--dkt)}
.trust{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:24px;font-size:13px;opacity:.85}
.trust span{display:flex;align-items:center;gap:6px}
.mock{background:var(--sf);color:var(--tx);border-radius:18px;padding:18px;box-shadow:0 24px 50px rgba(0,0,0,.4);transform:rotate(1.5deg);animation:floatSlow 6s ease-in-out infinite}
.mock .mh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.mock .ms{font-size:44px;font-weight:800;color:var(--ort);line-height:1;margin:12px 0 2px}.mock .ms small{font-size:15px;color:var(--mu);font-weight:600}
.mock .mr{margin:9px 0;font-size:12px}.mock .mr div:first-child{display:flex;justify-content:space-between;color:var(--mu);margin-bottom:3px}
.mock .mt{font-size:11px;color:var(--mu);margin-top:12px;text-align:center}
@media(max-width:860px){.hero{grid-template-columns:1fr}.mock{display:none}}

/* primeiros passos */
.todo{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.todo li{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);transition:transform .18s var(--ease),border-color .18s}
.todo li:hover{transform:translateX(4px)}
.todo li.next{border-color:var(--or);background:rgba(255,106,0,.07)}
.todo .tk{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;color:var(--mu)}
.todo li.done .tk{background:var(--ok);border-color:var(--ok);color:#fff}
.todo li.next .tk{border-color:var(--or);color:var(--ort)}
.todo .tx{flex:1;min-width:0}.todo .tx b{display:block;font-size:14px}.todo li.done .tx b{text-decoration:line-through;opacity:.6}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.step{padding:20px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;position:relative}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--or);color:var(--onor);display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.step h3{font-size:16px;margin-bottom:4px}
.band{background:var(--dk);color:var(--dkt);border-radius:24px;padding:clamp(26px,4vw,44px);text-align:center;border-top:4px solid var(--or)}
.band h2{font-size:clamp(22px,3.4vw,30px)}.band p{opacity:.85;margin:10px auto 22px;max-width:52ch}
.pbar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.pbar i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));transition:width .7s var(--ease);transform-origin:left;animation:barGrow .6s var(--ease)}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}
.bar.ok i{background:var(--ok)}
.bar.err i{background:var(--er)}
.bar.warn i{background:#e69500}

/* formulários */
label{font-size:12px;font-weight:600;color:var(--mu);display:block;margin:0 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:14px 'Sora',sans-serif;transition:border-color .18s,box-shadow .18s,transform .15s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px rgba(255,106,0,.2)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>.grow{flex:1;min-width:180px}
.inl{display:flex;align-items:center;gap:6px;margin:0;font-size:12px;white-space:nowrap}
.inl input{width:72px;padding:6px 8px}.inl select{width:auto;padding:6px 8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--tx);font-weight:400;cursor:pointer}.chk input{width:auto}

/* drag and drop */
.drop{border:2px dashed var(--or);border-radius:16px;padding:28px 20px;text-align:center;cursor:pointer;background:rgba(255,106,0,.05);transition:all .2s var(--ease);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ort)}
.drop:hover{background:rgba(255,106,0,.12);transform:translateY(-2px)}
.drop.over{background:rgba(255,106,0,.18);border-style:solid;transform:scale(1.01);box-shadow:0 0 0 5px rgba(255,106,0,.18)}
.drop.busy{opacity:.7;pointer-events:none;animation:pulseSoft 1.2s infinite}
.drop .dt{font-weight:700;color:var(--tx);font-size:15px}.drop .dh{font-size:13px;color:var(--mu)}
.drop.compact{padding:16px;flex-direction:row;justify-content:center;gap:12px;flex-wrap:wrap}.drop.compact .dt{font-size:14px}
.dbad{color:var(--er);font-size:13px;font-weight:600;width:100%}
.files{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.file{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);animation:scaleIn .22s var(--ease)}
.file .fi{flex:1;min-width:0}.file b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .pv{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file>.ico{color:var(--ort)}

/* tabelas, estatísticas e dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--ort);line-height:1.1}.stat span{font-size:12px;color:var(--mu)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.pill{padding:7px 16px;border-radius:99px;border:1.5px solid var(--or);color:var(--ort);background:transparent;font:600 13px 'Sora',sans-serif;cursor:pointer;transition:all .18s var(--ease)}
.pill:hover,.pill.on{background:var(--or);color:var(--onor);transform:translateY(-1px)}
.pill.add{border-style:dashed}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;margin-top:14px}
table{width:100%;border-collapse:collapse}
th{background:var(--dk);color:var(--dkt);text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
td{padding:6px 12px;border-top:1px solid var(--bd);transition:background .15s}
tbody tr:hover td{background:rgba(255,106,0,.06)}
.who{display:flex;align-items:center;gap:10px}
.av{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:rgba(255,106,0,.18);color:var(--ort);display:grid;place-items:center;font-size:12px;font-weight:800}
.who input,.nota{border-color:transparent;background:transparent;padding:6px 8px}
.who input:hover,.nota:hover{border-color:var(--bd)}.nota{max-width:90px}
.ta{text-align:right;width:50px}
.empty{text-align:center;padding:36px 20px;color:var(--mu)}.empty .fic{margin:0 auto 12px;width:54px;height:54px}.empty h3{color:var(--tx);margin-bottom:4px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details.adv{margin-top:12px}details.adv>summary{font-size:13px;font-weight:600;color:var(--mu);display:flex;align-items:center;gap:6px;transition:color .15s}
details.adv>summary:before{content:"▸";transition:.2s var(--ease)}details.adv[open]>summary:before{transform:rotate(90deg)}
details.adv>summary:hover{color:var(--ort)}details.adv>div,details.adv>p,details.adv>textarea{margin-top:8px;animation:fadeSlideUp .22s var(--ease)}

/* Dashboard de Análise Estatística */
.dash-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:16px}
@media(max-width:860px){.dash-grid{grid-template-columns:1fr}}
.gap-list{display:grid;gap:10px;margin-top:12px}
.gap-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);transition:transform .18s var(--ease)}
.gap-item:hover{transform:translateX(3px)}
.gap-item.crit{border-left:4px solid var(--er);background:var(--erb)}
.gap-item.warn{border-left:4px solid var(--wn);background:var(--wnb)}
.gap-item.ok{border-left:4px solid var(--ok);background:var(--okb)}
.chart-rows{display:grid;gap:12px;margin-top:12px}
.chart-row{display:grid;gap:4px}
.chart-lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.histo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:150px;padding:18px 8px 6px;border-bottom:2px solid var(--bd);margin-top:12px}
.hcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.hbar{width:100%;max-width:54px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--or2),var(--or));transition:height .6s var(--ease);min-height:6px}
.hbar.err{background:linear-gradient(180deg,#ff8a82,var(--er))}
.hbar.ok{background:linear-gradient(180deg,#4cd08a,var(--ok))}
.exp-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* correção */
.tinfo .top2{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.tinfo h2{font-size:22px;margin-bottom:8px}
.perf{display:flex;gap:10px;flex-wrap:wrap}.perf .stat{padding:8px 14px}.perf .stat b{font-size:20px}
.abar{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 8px);z-index:10;background:var(--sf);border:1px solid var(--or);border-radius:16px;padding:12px 14px;margin-top:16px;box-shadow:var(--sh)}
.abar .r1{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.abar .fld{flex:1;min-width:180px;max-width:340px}
.abar .sp{flex:1}
.tot{display:flex;align-items:center;gap:8px;line-height:1.2}.tot .mu{font-size:12px}
.score{font-size:40px;font-weight:800;color:var(--ort);line-height:1}
.qnav{display:flex;gap:6px;overflow-x:auto;padding-top:10px;margin-top:10px;border-top:1px solid var(--bd)}
.qc{flex:0 0 auto;min-width:40px;padding:4px 10px;border-radius:8px;border:1.5px solid var(--bd);background:var(--bg);font:600 12px 'Sora',sans-serif;color:var(--mu);cursor:pointer;transition:.15s}
.qc:hover{transform:translateY(-1px);border-color:var(--or)}
.qc.ev{border-color:var(--or);color:var(--ort)}.qc.dn{background:var(--ok);border-color:var(--ok);color:#fff}
.hint{margin-top:10px;font-size:13px}

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const AT={class:'className',for:'htmlFor',tabindex:'tabIndex',autoplay:'autoPlay',playsinline:'playsInline'};
const ce=(t,p,...c)=>{if(p){const q={};for(const k in p)q[AT[k]||k]=p[k];if(typeof q.style==='string')q.style=Object.fromEntries(q.style.split(';').filter(s=>s.includes(':')).map(s=>{const[k,...v]=s.split(':');return[k.trim().replace(/-([a-z])/g,(_,x)=>x.toUpperCase()),v.join(':').trim()]}));p=q}return React.createElement(t,p,...c)};
const h=htm.bind(ce);
class EB extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?h`<main class="wrap"><div class="note err">Ocorreu um erro: ${String(this.state.e.message||this.state.e)}</div><p style="margin-top:12px"><button class="btn" onClick=${()=>this.setState({e:null})}>Tentar de novo</button></p></main>`:this.props.children}}
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function usePersist(k,d){const[s,set]=useState(()=>ld(k,d));useEffect(()=>{const id=setTimeout(()=>sv(k,s),400);return()=>clearTimeout(id)},[s]);return[s,set]}

/* ===== Motor FALPD: extração de padrões + classificador logístico com aprendizagem online (sem LLM) ===== */
const STOP=new Set('que uma uns umas dos das nos nas por para com como mas aos foi ser sao ele ela seu sua lhe mais ja tambem pelo pela isso este esta esse essa entre sobre'.split(' '));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const tok=s=>(norm(s).match(/[a-z]{3,}/g)||[]).filter(w=>!STOP.has(w)).map(w=>w.slice(0,6));
const tf=a=>{const m={};a.forEach(w=>m[w]=(m[w]||0)+1);return m};
const cos=(a,b)=>{let d=0,x=0,y=0;for(const k in a){x+=a[k]*a[k];if(b[k])d+=a[k]*b[k]}for(const k in b)y+=b[k]*b[k];return x&&y?d/Math.sqrt(x*y):0};
const topSet=(t,n)=>{const f=tf(tok(t));return new Set(Object.keys(f).sort((a,b)=>f[b]-f[a]).slice(0,n))};
const RES=['metafora','ironia','satira','caricatura','comparacao','personificacao','hiperbole','antitese','enumeracao','anafora','aliteracao','sinestesia','adjetivacao','apostrofe','simbolo','eufemismo','paradoxo','oximoro','gradacao','alegoria','retorica','assindeto','polissindeto'];
const INF=['sugere','simboliza','revela','evidencia','transmite','remete','denuncia','implicito','subentend','critica','reflete','representa','demonstra'];
const CON=['porque','pois','portanto','logo','assim','contudo','no entanto','alem disso','por isso','deste modo','dado que','uma vez que','em suma','por outro lado'];
const FN=['Semelhança com a resposta-modelo','Cobertura dos conceitos-chave','Expressões coincidentes (bigramas)','Alinhamento com o contexto da obra','Alinhamento com os critérios do domínio','Recursos expressivos','Extensão adequada','Interpretação do subentendido','Conectores / coesão','Diversidade lexical','Elementos essenciais presentes','Figura de estilo trocada','Semântica: o aluno diz o que o modelo diz','Semântica: o que o aluno diz está no modelo','Ortografia (dicionário)','Pontuação'];
const W0={w:[1.6,1.8,1.2,.4,.3,.5,.8,.4,.4,.3,1.6,-.4,1.4,.6,.5,.5],b:-4.3,n:0,h:[]},WE={w:[.8,1,.5,.4,.3,.5,1.2,.4,.8,.8,1.6,-.4,.8,.4,1.2,1],b:-4.4,n:0,h:[]},MD0={EL:W0,ES:WE,GR:W0,LE:W0};
const FIGN={metafor:'metáfora',comparac:'comparação',personific:'personificação',hiperbol:'hipérbole',ironi:'ironia',antites:'antítese',enumerac:'enumeração',gradac:'gradação',sinestes:'sinestesia',adjetivac:'adjetivação',aliterac:'aliteração',anafor:'anáfora',apostrof:'apóstrofe',eufemism:'eufemismo',paradox:'paradoxo',oximor:'oxímoro',simbol:'símbolo',alegor:'alegoria',caricatur:'caricatura',satir:'sátira',assindet:'assíndeto',polissindet:'polissíndeto',retoric:'interrogação retórica'};
const FIG=Object.keys(FIGN),figs=t=>{const n=norm(t);return FIG.filter(f=>n.includes(f))};

/* elementos essenciais: definidos pelo professor ou, por defeito, as figuras de estilo nomeadas na resposta-modelo */
const essOf=q=>{const L=(q.chave||'').split('\n').map(x=>x.trim()).filter(Boolean);return L.length?L.map(l=>{const[a,w]=l.split('::');return{lab:a.trim(),alts:a.split('|').map(x=>norm(x).trim()).filter(Boolean),w:+w||1}}):figs(q.model||'').map(f=>({lab:FIGN[f],alts:[f],w:2}))};
const sig=z=>1/(1+Math.exp(-z));
const pred=(m,x)=>sig(m.b+x.reduce((s,v,i)=>s+v*m.w[i],0));
const hits=(a,l)=>l.filter(w=>a.includes(w)).length;
const bg=a=>a.slice(1).map((w,i)=>a[i]+'_'+w);

function feats(ans,ref,ctx,crit,ess,sem,lg,rng){
 const ta=tok(ans),tr=tok(ref);if(!ta.length)return FN.map(()=>0);
 const sa=new Set(ta),sr=new Set(tr),na=norm(ans),ba=new Set(bg(ta)),br=bg(tr);
 const ov=S=>S.size?[...sa].filter(w=>S.has(w)).length/sa.size:0;
 const ws=na.match(/[a-z]+/g)||[],nw=ws.length||1,nr=Math.max((norm(ref).match(/[a-z]+/g)||[]).length,1),r=nw/nr;
 let c=0,sw=0;(ess||[]).forEach(it=>{sw+=it.w;if(it.alts.some(z=>na.includes(z))||(sem&&sem.hit[it.lab]))c+=it.w});
 const mf=figs(ref),sf=figs(ans),wrong=mf.length&&sf.length&&!sf.some(f=>mf.includes(f))?1:0;
 const L=[cos(tf(ta),tf(tr)),sr.size?[...sr].filter(w=>sa.has(w)).length/sr.size:0,br.length?br.filter(b=>ba.has(b)).length/br.length:0,ov(topSet(ctx,400)),ov(topSet(crit,250)),Math.min(hits(na,RES),3)/3,(rng?(nw<rng[0]?nw/rng[0]:nw>rng[1]?rng[1]/nw:1):Math.min(r,1/r)),Math.min(hits(na,INF),3)/3,Math.min(hits(na,CON),4)/4,Math.min(new Set(ws).size/nw*1.2,1),sw?(c/sw-.5)*2:0,wrong];
 L.push(sem?sem.cov:L[0],sem?sem.prec:L[1],lg&&lg.sp!=null?lg.sp:.75,lg?lg.pu:.75);return L;
}

const train=(m,x,t)=>{const h=[...(m.h||[]),[x,t]].slice(-200);let w=[...m.w],b=m.b;for(let e=0;e<6;e++)for(const[xi,ti]of h){const er=ti-sig(b+xi.reduce((s,v,i)=>s+v*w[i],0));w=w.map((v,i)=>v+.12*(er*xi[i]-.01*v));b+=.12*er}return{w,b,n:m.n+1,h}};
const DOMN={EL:'Educação literária',ES:'Escrita',GR:'Gramática',LE:'Leitura'};
const detDom=t=>{const n=norm(t);return/\b(escreva|redija|elabore|produza)\b/.test(n)&&/(palavras|texto|apreciacao|opiniao|ensaio|artigo)/.test(n)?'ES':/(oracao|subordinada|coordenada|funcao sintatica|complemento|classe de palavras|valor modal|tempo verbal|pronome|determinante|sujeito|predicativo|deixis)/.test(n)?'GR':'EL'};
const qdom=q=>q.dom||detDom(q.text);

/* critérios: só as páginas de Português 12.º (exclui PLNM e outras disciplinas) e só o domínio da questão */
const PTR=/P\s*O\s*R\s*T\s*U\s*G\s*U[EÊ]\s*S\s*[-–]?\s*12/i,pgs=t=>t.split(/[\f\n]/),isPT=g=>PTR.test(g)&&!/PLNM/i.test(g);
const critPT=t=>{const p=pgs(t).filter(isPT);return p.length?p.join(' '):t};
const ptPages=t=>[pgs(t).filter(isPT).length,pgs(t).filter(Boolean).length];
const HD=[['LE',/Leitura\s*:?\s*20\s*%/i],['EL',/Educa[cç][aã]o\s+liter[aá]ria\s*:?\s*20\s*%/i],['ES',/Escrita\s*:?\s*20\s*%/i],['GR',/Gram[aá]tica\s*:?\s*10\s*%/i]];
const critDom=(t,d)=>{const s=critPT(t),p=HD.map(([k,r])=>[k,s.search(r)]).filter(x=>x[1]>=0).sort((a,b)=>a[1]-b[1]),i=p.findIndex(x=>x[0]===d);return i<0?s:s.slice(p[i][1],i+1<p.length?p[i+1][1]:s.length)};

/* ===== Análise semântica local ===== */
const EMB={ext:null};
async function loadEmb(cb){if(EMB.ext)return;const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.1.2');EMB.ext=await T.pipeline('feature-extraction','Xenova/paraphrase-multilingual-MiniLM-L12-v2',{dtype:'q8',progress_callback:p=>{if(p.status==='progress'&&cb)cb('A descarregar o modelo (só na primeira vez)… '+Math.round(p.progress||0)+'%')}})}
const sents=t=>t.replace(/\s+/g,' ').split(/(?<=[.!?;:])\s+/).map(x=>x.trim()).filter(x=>x.length>8);
const embed=async a=>(await EMB.ext(a,{pooling:'mean',normalize:true})).tolist();
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
async function semOf(ans,ref,ess){
 const A=sents(ans),R=sents(ref);if(!A.length||!R.length)return null;
 const E=await embed([...A,...R]),ea=E.slice(0,A.length),er=E.slice(A.length),sc=v=>Math.max(0,Math.min(1,(v-.25)/.5));
 const cov=er.reduce((s,r)=>s+sc(Math.max(...ea.map(a=>dot(a,r)))),0)/er.length,prec=ea.reduce((s,a)=>s+sc(Math.max(...er.map(r=>dot(a,r)))),0)/ea.length;
 const its=(ess||[]).filter(i=>!i.alts.some(z=>FIG.includes(z))&&!i.lab.includes('|')&&i.lab.includes(' ')),hit={};
 if(its.length){const Lb=await embed(its.map(i=>i.lab));its.forEach((it,k)=>{hit[it.lab]=Math.max(...ea.map(a=>dot(a,Lb[k])))>=.5})}
 return{cov,prec,hit};
}

/* ===== Dicionário (ortografia) e regras de pontuação ===== */
const DICT={sp:null};
async function loadDict(cb){
 if(DICT.sp)return;
 if(typeof Typo==='undefined'){cb&&cb('A carregar o verificador…');await new Promise((ok,ko)=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/typo-js@1.4.0/typo.js';e.onload=ok;e.onerror=()=>ko(new Error('não foi possível carregar o typo.js'));document.head.appendChild(e)})}
 cb&&cb('A descarregar o dicionário de português (cerca de 1,5 MB)…');
 const[aff,dic]=await Promise.all(['aff','dic'].map(x=>fetch('https://cdn.jsdelivr.net/npm/dictionary-pt-pt@2.0.0/index.'+x).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})));
 cb&&cb('A preparar o dicionário…');await new Promise(r=>setTimeout(r,30));
 DICT.sp=new Typo('pt_PT',aff,dic,{platform:'any'});
}
const WRE=/\p{L}+(?:-\p{L}+)*/gu;
function spell(text,known){
 if(!DICT.sp)return null;
 const T=text.replace(/\s+/g,' '),out=[];let m;WRE.lastIndex=0;
 while((m=WRE.exec(T))){const w=m[0];if(w.length<3||w===w.toUpperCase())continue;
 const prev=T.slice(0,m.index).trimEnd(),start=!prev||/[.!?:]["»”)]*$/.test(prev);
 if(/^\p{Lu}/u.test(w)&&!start)continue;
 if(known&&known.has(norm(w)))continue;

const VB='é|são|foi|era|eram|tem|têm|há|critica|ridiculariza|mostra|revela|representa|simboliza|evidencia|retrata|sugere|demonstra|expressa|transmite|denuncia|ilustra|reflete|reflecte|caracteriza|refere|apresenta|utiliza|usa|permite|contribui|afirma|diz|considera|indica|parece|acredita|pretende|procura|faz|dá|leva|torna|provoca|cria|produz|estabelece|opõe|contrasta|associa|relaciona|destaca|sublinha|evoca|invoca|exprime|traduz|significa|implica|pressupõe|confirma|reforça|acentua|intensifica|descreve|narra|relata|explica|justifica|comprova';
const CN='Contudo|Todavia|Porém|Portanto|Assim sendo|Em suma|Por isso|No entanto|Além disso|Por outro lado|Em primeiro lugar|Em segundo lugar|Em conclusão|Deste modo|Ou seja|Por fim|Em síntese|Com efeito|Por conseguinte';
function pontos(t){
 const T=t.replace(/\s+/g,' ').trim(),out=[];if(!T)return out;let m;
 const add=(i,len,msg,soft)=>out.push({msg,soft:!!soft,ctx:'…'+T.slice(Math.max(0,i-18),i+len+18)+'…'});
 const R=(re,fn)=>{re.lastIndex=0;while((m=re.exec(T)))fn(m)};

 R(/([\p{L}\d])\s+(mas|porém|contudo|todavia)(?![\p{L}])(?!\s+também)/giu,m=>add(m.index,m[0].length,'falta vírgula antes de «'+m[2]+'»'));
 R(new RegExp('(?:^|[.!?]\\s+)('+CN+')\\s+(?=\\p{L})','giu'),m=>add(m.index,m[0].length,'falta vírgula depois de «'+m[1]+'»',true));
 R(/(\p{L}),\s+e\s+(?=\p{L})/giu,m=>add(m.index,m[0].length,'vírgula antes de «e» (em regra não se usa; só com sujeitos diferentes ou ênfase)',true));
 R(/\s[,.;:!?]/g,m=>add(m.index,2,'espaço antes de sinal de pontuação'));
 R(/[,;:]\p{L}/gu,m=>add(m.index,2,'falta espaço depois do sinal de pontuação'));
 R(/\p{Ll}{2}[.!?]\p{Lu}\p{Ll}/gu,m=>add(m.index,m[0].length,'falta espaço depois do ponto'));

 if(!/[.!?…»”")]$/.test(T))out.push({msg:'o texto não termina com pontuação final',soft:true,ctx:'…'+T.slice(-30)});

}
function lingua(a,known){
 const nw=Math.max((a.match(/\p{L}+/gu)||[]).length,1),ps=pontos(a),es=spell(a,known),w=ps.reduce((s,e)=>s+(e.soft?.5:1),0)/nw*100;

const rangeOf=t=>{const n=norm(t),m=n.match(/(\d{2,4})\s*(?:a|e|-|–)\s*(\d{2,4})\s*palavras/);if(m)return[+m[1],+m[2]];const k=n.match(/(?:minimo de|pelo menos|no minimo)\s*(\d{2,4})\s*palavras/);return k?[+k[1],Math.round(+k[1]*1.6)]:null};

/* ===== Estrutura do teste + Identificação automática de Respostas-Modelo + Batch Upload ===== */
const ctxOf=(t,all)=>[...t.ctx,...(t.reuse?all.filter(o=>o.id!==t.id&&norm(o.author)===norm(t.author)).flatMap(o=>o.ctx):[])].map(d=>d.text).join(' ');
const gn=g=>g&&g.m?g.p/g.m*20:0;

/* Extrai mapa de respostas-modelo de um bloco de texto de critérios/soluções */
function extractModelMap(solText){
 const map={};
 if(!solText||!solText.trim())return map;
 const T=solText.replace(/\s+/g,' ').trim();
 const re=/(?:^|\s)(?:Quest[aã]o\s+|Item\s+|Pergunta\s+)?(\d{1,2}(?:\.\d{1,2})?)[.):\-–]\s+/gi,mk=[];let r;
 while((r=re.exec(T)))mk.push({i:r.index,l:r[1],e:re.lastIndex});
 mk.forEach((k,idx)=>{
  let body=T.slice(k.e,idx+1<mk.length?mk[idx+1].i:T.length).trim();
  body=body.replace(/^(?:\d+\s*(?:pontos|pts)\s*[-–:.]?\s*)/i,'').trim();
  if(body.length>8&&!map[k.l])map[k.l]=body;
 });
 return map;
}

function parseTest(raw){
 const full=raw.replace(/\s+/g,' ').trim();
 /* Deteta se o PDF/texto possui uma secção final de Critérios Específicos / Respostas-Modelo / Soluções */
 const solSplit=full.split(/(?=\b(?:CRIT[EÉ]RIOS\s+ESPEC[IÍ]FICOS(?:\s+DE\s+CLASSIFICA[CÇ][AÃ]O)?|PROPOSTA\s+DE\s+(?:RESOLU[CÇ][AÃ]O|CORRE[CÇ][AÃ]O)|RESPOSTAS?[- ]MODELO|CEN[AÁ]RIOS?\s+DE\s+RESPOSTA|SOLU[CÇ][OÕ]ES\s+DO\s+TESTE|CHAVE\s+DE\s+CORRE[CÇ][AÃ]O)\b)/i);
 const T=solSplit[0].trim();
 const solBlock=solSplit.length>1?solSplit.slice(1).join(' '):'';
 const solMap=extractModelMap(solBlock);

 const heads=T.split(/(?=\bGRUPO\s+[IVX]+\b)/i).filter(p=>/^GRUPO\s+[IVX]+/i.test(p)&&p.length>40);
 let n=0;
 return(heads.length?heads:[T]).map((p,gi)=>{
  const hm=p.match(/^GRUPO\s+[IVX]+/i),body=hm?p.slice(hm[0].length):p;
  const re=/(?:^|\s)(\d{1,2}(?:\.\d{1,2})?)[.)]\s+(?=[A-ZÀ-Ú«“"])/g,mk=[];let r;
  while((r=re.exec(body)))mk.push({i:r.index,l:r[1],e:re.lastIndex});
  const mq=(l,tx)=>{
   const pm=tx.match(/(\d{1,3})\s*(?:pontos|pts)/i);
   /* Verifica se a própria pergunta tem Resposta-modelo / Cenário de resposta inline */
   let cleanTx=tx,inlineMod='';
   const im=tx.match(/^(.*?)\b(?:Resposta[- ]modelo|Cen[aá]rio\s+de\s+resposta|Proposta\s+de\s+resposta|Crit[eé]rio\s+de\s+resposta|Solu[cç][aã]o|Resposta\s+esperada)\s*[:\-–]\s*([\s\S]{10,})$/i);
   if(im){cleanTx=im[1].trim();inlineMod=im[2].trim()}
   const model=inlineMod||solMap[l]||'';
   return{id:'q'+(++n),label:l,text:cleanTx,max:pm?+pm[1]:10,model,dom:detDom(cleanTx)};
  };
  const qs=mk.length?mk.map((k,i)=>mq(k.l,body.slice(k.e,i+1<mk.length?mk[i+1].i:body.length).trim())):[mq('1',body.trim())];
  return{id:'g'+gi,name:hm?hm[0].replace(/\s+/,' ').toUpperCase():'Teste',intro:mk.length?body.slice(0,mk[0].i).trim():'',qs};
 });
}

/* Separa as respostas de um aluno por número de questão (ex.: 1.1, 1.2, 2.1) */
function splitStudentAnswers(rawText,AQ){
 const res={};
 if(!rawText||!rawText.trim())return res;
 const T=rawText.replace(/\s+/g,' ').trim();
 /* Procura marcadores das questões do teste */
 const labels=AQ.map(({q})=>({id:q.id,label:q.label,re:new RegExp('(?:^|\\s)(?:Quest[aã]o\\s+|Pergunta\\s+|Item\\s+|Grupo\\s+[IVX]+\\s*[-–.]?\\s*)?'+q.label.replace('.','\\.')+'\\s*[.):\\-–]\\s+','i')}));
 const found=[];
 labels.forEach(lb=>{const m=lb.re.exec(T);if(m)found.push({id:lb.id,label:lb.label,i:m.index,e:m.index+m[0].length})});
 found.sort((a,b)=>a.i-b.i);
 if(found.length){
  found.forEach((f,idx)=>{
   const slice=T.slice(f.e,idx+1<found.length?found[idx+1].i:T.length).trim();
   if(slice)res[f.id]=slice;
  });
 }else if(AQ.length===1){
  res[AQ[0].q.id]=T;
 }else{
  /* fallback por marcadores genéricos 1.1, 1.2... */
  const gen=/(?:^|\s)(\d{1,2}(?:\.\d{1,2})?)[.):\-–]\s+/g,mk=[];let r;
  while((r=gen.exec(T)))mk.push({l:r[1],i:r.index,e:gen.lastIndex});
  mk.forEach((k,idx)=>{
   const qMatch=AQ.find(({q})=>q.label===k.l);
   if(qMatch){res[qMatch.q.id]=T.slice(k.e,idx+1<mk.length?mk[idx+1].i:T.length).trim()}
  });
 }
 return res;
}

/* Processa múltiplos ficheiros ou páginas para Importação em Lote (Batch Upload) */
function parseBatchFiles(fileItems,students,AQ){
 const entries=[];
 fileItems.forEach(item=>{
  /* Verifica se um único PDF tem vários alunos separados por "Aluno:" / "Nome:" ou páginas */
  const blocks=item.text.split(/(?=(?:^|\f|\n)\s*(?:Aluno|Nome(?:\s+do\s+aluno)?|Teste\s+de)\s*[:\-–]\s*[^\n\f]{3,50})/i).map(x=>x.trim()).filter(Boolean);
  const chunks=blocks.length>1?blocks:[item.text];
  chunks.forEach((chunk,ci)=>{
   const head=norm(item.name+' '+chunk.slice(0,350));
   let matchedStudent=students.find(s=>{
    const sn=norm(s.name);
    if(!sn)return false;
    if(head.includes(sn))return true;
    const parts=sn.split(/\s+/).filter(w=>w.length>2);
    return parts.length>=2&&parts.every(p=>head.includes(p));
   });
   if(!matchedStudent&&students.length&&chunks.length===1&&fileItems.length===1){
    matchedStudent=students[0];
   }
   const qMap=splitStudentAnswers(chunk,AQ);
   entries.push({
    key:item.name+'#'+ci,
    fileName:chunks.length>1?`${item.name} (Secção ${ci+1})`:item.name,
    studentId:matchedStudent?String(matchedStudent.id):(students[0]?String(students[0].id):''),
    qMap,
    raw:chunk,
    isScan:chunk.replace(/\s+/g,'').length<30
   });
  });
 });
 return entries;
}

/* Segunda opinião LLM */
async function opinion(c,{crit,paper,ctx,intro,q,ans,ess}){
 const prompt=`És um segundo avaliador de Português (12.º ano, Portugal). Dás apenas uma OPINIÃO: a decisão final é de outro sistema e do professor.\n\nCRITÉRIOS (domínio avaliado):\n${crit.slice(0,3500)}\n\nTESTE:\n${paper.slice(0,6000)}\n\nCONTEXTO (obras do autor):\n${ctx.slice(0,6000)}\n\nTEXTO DO GRUPO:\n${intro.slice(0,2500)}\n\nQUESTÃO (${q.max} pontos): ${q.text}\n\nRESPOSTA-MODELO:\n${q.model}\n\n${ess?'ELEMENTOS ESSENCIAIS (definidos pelo professor): '+ess+'. Se o aluno nomear uma figura de estilo diferente da correta, não lhe dês a nota do elemento.\n\n':''}RESPOSTA DO ALUNO:\n${ans}\n\nDevolve APENAS JSON: {"nota": número entre 0 e ${q.max} em passos de 0.5, "justificacao": "2 a 3 frases", "elementos": [{"nome": "...", "presente": true ou false}]}. Em "elementos" avalia, um a um, os elementos essenciais indicados acima (ou, se não houver, 2 a 4 elementos que a resposta-modelo exige); "presente" só é true se o aluno os afirma corretamente, sem os confundir com outro.`;
 let txt;
 if(c.prov==='claude'){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model||'claude-sonnet-4-5',max_tokens:500,messages:[{role:'user',content:prompt}]})});
  const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||r.status);txt=d.content[0].text;
 }else{
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(c.model||'gemini-flash-latest')+':generateContent?key='+encodeURIComponent(c.key),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.2,responseMimeType:'application/json'}})});
  const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||r.status);txt=d.candidates[0].content.parts[0].text;
 }
 const j=JSON.parse(txt.match(/\{[\s\S]*\}/)[0]);
 return{nota:Math.max(0,Math.min(q.max,Math.round(+j.nota*2)/2)),just:String(j.justificacao||''),el:Array.isArray(j.elementos)?j.elementos.filter(z=>z&&z.nome).map(z=>({nome:String(z.nome),presente:z.presente===true})):[]};
}

/* ===== Cálculo de Estatísticas da Turma & Exportação (Excel / CSV / PDF) ===== */
function computeClassAnalytics(c,tests,m,crit){
 const cTests=tests.filter(t=>t.classId===c.id);
 const sts=c.students||[];
 const qStats=[];
 const domTotals={EL:{s:0,m:0,f:0,t:0},LE:{s:0,m:0,f:0,t:0},GR:{s:0,m:0,f:0,t:0},ES:{s:0,m:0,f:0,t:0}};
 const skillFails={fig:0,figTot:0,ess:0,essTot:0,sub:0,subTot:0,ort:0,ortTot:0};
 const gaps=[];

 cTests.forEach(t=>{
  const AQ=(t.groups||[]).flatMap(g=>g.qs.map(q=>({g,q})));
  AQ.forEach(({g,q})=>{
   const dom=qdom(q),ess=essOf(q),hasFig=figs(q.model||'').length>0||ess.length>0||/recurso|figura|expressiv|estil/i.test(q.text);
   let evalCount=0,failCount=0,sumPct=0,figFailCount=0;
   sts.forEach(s=>{
    const sid=String(s.id);
    const gEntry=(t.grades||{})[sid];
    const savedQ=gEntry&&gEntry.qs&&gEntry.qs[q.id];
    const rawAns=((t.answers||{})[sid]||{})[q.id]||'';
    let pct=null,failedEss=false;
    if(savedQ){
     pct=q.max?savedQ.p/q.max:0;
     failedEss=savedQ.wrong>0||(savedQ.es&&savedQ.es.some(e=>!e.hit));
    }else if(rawAns.trim()&&q.model&&q.model.trim()){
     const x=feats(rawAns,q.model,'',critDom(crit||'',dom),ess,null,null,rangeOf(q.text));
     pct=pred(m[dom]||W0,x);
     const na=norm(rawAns);
     failedEss=x[11]>0||(ess.length>0&&ess.some(it=>!it.alts.some(z=>na.includes(z))));
     if(x[7]<.35)skillFails.sub++;
     skillFails.subTot++;
    }
    if(pct!==null){
     evalCount++;
     sumPct+=pct;
     if(pct<.5)failCount++;
     if(failedEss||(hasFig&&pct<.5))figFailCount++;
     domTotals[dom].s+=pct;
     domTotals[dom].m+=1;
     if(pct<.5)domTotals[dom].f+=1;
     domTotals[dom].t+=1;
     if(hasFig){skillFails.figTot++;if(pct<.5||failedEss)skillFails.fig++}
     if(ess.length){skillFails.essTot++;if(failedEss)skillFails.ess++}
    }
   });
   if(evalCount>0){
    const failRate=Math.round(failCount/evalCount*100);
    const figFailRate=Math.round(figFailCount/evalCount*100);
    const avgPct=Math.round(sumPct/evalCount*100);
    const topic=hasFig?'recursos expressivos / figuras de estilo':dom==='GR'?'gramática':dom==='ES'?'produção escrita':'interpretação literária';
    qStats.push({id:t.id+'_'+q.id,testName:t.name,groupName:g.name,label:q.label,dom,topic,hasFig,evalCount,failRate,figFailRate,avgPct,max:q.max});
    if(failRate>=50||figFailRate>=50){
     const rate=Math.max(failRate,figFailRate);
     gaps.push({
      rate,
      sev:rate>=70?'crit':'warn',
      msg:`${rate}% da turma falhou a pergunta de ${topic} do ${g.name} (Questão ${q.label} · ${t.name})`,
      rec:hasFig?`Preparar revisão sobre ${ess.map(e=>e.lab).join(', ')||'identificação e valor expressivo das figuras de estilo'}.`:`Reforçar exercícios de ${DOMN[dom].toLowerCase()} e estruturação da resposta.`
     });
    }
   }
  });
 });

 /* Notas finais dos alunos (0-20) */
 const studentRows=sts.map((s,idx)=>{
  const sid=String(s.id);
  let finalNota=s.nota!=null&&s.nota!==''?+s.nota:null;
  if(finalNota===null){
   for(let i=cTests.length-1;i>=0;i--){
    const g=(cTests[i].grades||{})[sid];
    if(g&&g.m){finalNota=+gn(g).toFixed(1);break}
   }
  }
  return{num:idx+1,id:s.id,name:s.name,nota:finalNota,round:finalNota!==null?Math.round(finalNota):null};
 });
 const validGrades=studentRows.filter(r=>r.nota!==null);
 const avgClass=validGrades.length?(validGrades.reduce((a,b)=>a+b.nota,0)/validGrades.length):null;
 const passCount=validGrades.filter(r=>r.nota>=9.5).length;
 const failStudents=validGrades.length-passCount;
 if(validGrades.length>0&&failStudents/validGrades.length>=.4&&!gaps.length){
  const r=Math.round(failStudents/validGrades.length*100);
  gaps.push({rate:r,sev:r>=60?'crit':'warn',msg:`${r}% da turma obteve classificação inferior a 9,5 valores na pauta global`,rec:'Agendar aula de recuperação e revisão dos conteúdos essenciais.'});
 }
 gaps.sort((a,b)=>b.rate-a.rate);

 /* Distribuição em 4 escalões */
 const dist=[
  {lab:'0 – 9,4',sub:'Insuficiente',cnt:validGrades.filter(r=>r.nota<9.5).length,cls:'err'},
  {lab:'9,5 – 13,4',sub:'Suficiente',cnt:validGrades.filter(r=>r.nota>=9.5&&r.nota<13.5).length,cls:''},
  {lab:'13,5 – 16,4',sub:'Bom',cnt:validGrades.filter(r=>r.nota>=13.5&&r.nota<16.5).length,cls:''},
  {lab:'16,5 – 20',sub:'Muito Bom',cnt:validGrades.filter(r=>r.nota>=16.5).length,cls:'ok'}
 ];

 return{cTests,qStats,domTotals,gaps,studentRows,validGrades,avgClass,passCount,dist};
}

function downloadBlob(content,filename,mime){
 const blob=new Blob([content],{type:mime});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();
 setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},200);
}

/* Zona de largar PDFs */
function DropZone({multi,busy,onFiles,title,hint,compact}){
 const[over,setOver]=useState(false),[bad,setBad]=useState(''),r=useRef(),n=useRef(0);
 const take=list=>{const all=[...list],ok=all.filter(isPdf);setBad(all.length&&ok.length<all.length?(ok.length?'Ignorei '+(all.length-ok.length)+' ficheiro(s) que não são PDF.':'Só são aceites ficheiros PDF.'):'');if(ok.length)onFiles(multi?ok:ok.slice(0,1))};
 const dp=e=>{e.preventDefault();e.stopPropagation()};
 return h`<div class=${'drop'+(over?' over':'')+(compact?' compact':'')+(busy?' busy':'')} role="button" tabindex="0" aria-label=${title}
  onClick=${()=>r.current.click()} onKeyDown=${e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();r.current.click()}}}
  onDragEnter=${e=>{dp(e);n.current++;setOver(true)}} onDragOver=${e=>{dp(e);if(e.dataTransfer)e.dataTransfer.dropEffect='copy'}}
  onDragLeave=${e=>{dp(e);n.current=Math.max(0,n.current-1);if(!n.current)setOver(false)}}
  onDrop=${e=>{dp(e);n.current=0;setOver(false);take(e.dataTransfer.files)}}>
  <${Ico} n="up" s=${compact?22:32}/>
  <div class="dt">${busy?'A ler PDF…':over?'Larga aqui para carregar':title}</div>
  <div class="dh">${hint}</div>
  ${bad&&h`<div class="dbad" role="alert">${bad}</div>`}
  <input ref=${r} type="file" accept="application/pdf,.pdf" multiple=${!!multi} hidden onClick=${e=>e.stopPropagation()} onChange=${e=>{take(e.target.files);e.target.value=''}}/>
 </div>`;
}

function PdfInput({multi,items,onAdd,onDel,title,hint,compact,max=150000,preview}){
 const[busy,setBusy]=useState(false),[err,setErr]=useState('');
 const go=async fl=>{setBusy(true);setErr('');for(const f of fl){try{onAdd({name:f.name,text:(await pdfText(f)).slice(0,max)})}catch(x){setErr('Não foi possível ler «'+f.name+'»: '+(x&&x.message?x.message:x)+'.')}}setBusy(false)};
 return h`<div><${DropZone} multi=${multi} busy=${busy} onFiles=${go} title=${title} hint=${hint} compact=${compact}/>
  ${err&&h`<div class="note err" role="alert">${err}</div>`}
  ${items.length>0&&h`<ul class="files">${items.map((d,i)=>h`<li class="file" key=${i}><${Ico} n="file" s=${22}/><div class="fi"><b title=${d.name}>${d.name}</b>
  <span class="mu">${fmtN(d.text.length)} caracteres lidos</span>${d.text.trim().length<30&&h` <span class="chip warn">sem texto — pode ser uma digitalização</span>`}
  ${preview&&d.text.trim().length>=30&&h`<div class="pv">${d.text.slice(0,160)}…</div>`}</div>
  <button class="ibtn" aria-label=${'Remover '+d.name} onClick=${()=>onDel(i)}><${Ico} n="x"/></button></li>`)}</ul>`}</div>`;
}

function Clamp({text}){const[o,setO]=useState(false),long=text.length>260;return h`<div><div class=${'stmt'+(long&&!o?' cl':'')}>${text||'(sem enunciado)'}</div>${long&&h`<button class="lnk" onClick=${()=>setO(!o)}>${o?'Mostrar menos':'Ver enunciado completo'}</button>`}</div>`}

/* ===== Dummy Page: Criar Conta / Iniciar Sessão ===== */
function AuthPage({user,setUser,go}){
 const[mode,setMode]=useState(user.hasAccount?'login':'register');
 const[email,setEmail]=useState(user.email||'');
 const[pass,setPass]=useState('');
 const[msg,setMsg]=useState('');

 const submit=e=>{
  e.preventDefault();
  if(!email.trim()||!pass.trim()){setMsg('Preenche o email e a palavra-passe.');return}
  setUser({loggedIn:true,hasAccount:true,email:email.trim(),mode});
  setPass('');
  setMsg(mode==='register'?'Conta criada e sessão iniciada com sucesso!':'Sessão iniciada com sucesso!');
 };

 const toggleStatus=()=>{
  if(user.loggedIn){
   setUser({...user,loggedIn:false});
   setMsg('Sessão terminada. O botão no topo mudou para «Iniciar sessão».');
  }else if(user.hasAccount){
   setUser({loggedIn:false,hasAccount:false,email:''});
   setMsg('Estado reposto para novo utilizador («Criar conta / Iniciar sessão»).');
  }
 };

 return h`<div class="page-anim">

   <div style="text-align:center">

    </div>
    <div>

    </div>
    <button type="submit" class="btn lg" style="width:100%;margin-top:4px">
     <${Ico} n="check" s=${18}/> ${mode==='register'?'Criar conta':'Iniciar sessão'}
    </button>
   </form>

   ${msg&&h`<div class="note ok" style="margin-top:14px">${msg}</div>`}

    <span class="chip ${user.loggedIn?'ok':'or'}">
     Estado: ${user.loggedIn?'Sessão iniciada ('+user.email+')':user.hasAccount?'Conta criada (sessão desligada)':'Sem conta'}
    </span>
    ${(user.loggedIn||user.hasAccount)&&h`<button type="button" class="btn k s" onClick=${toggleStatus}>

  onAdd=${d=>setDocs(o=>({...o,crit:[d]}))} onDel=${i=>setDocs(o=>({...o,crit:(o.crit||[]).filter((_,j)=>j!==i)}))}/>
 ${crit.length>0&&h`<div class=${'note '+(pp[0]?'ok':'')}>${pp[0]?'Páginas de Português 12.º reconhecidas: '+pp[0]+' de '+pp[1]+'. As restantes disciplinas são ignoradas.':'Não encontrei páginas de Português 12.º neste PDF — vai ser usado o documento inteiro.'}</div>`}

/* ===== Turmas + Dashboard de Análise Estatística + Exportação (Excel / CSV / PDF) ===== */
function Dash({cls,setCls,tests,setTests,m,crit,go,setTid}){
 const[ci,setCi]=useState(0),[nm,setNm]=useState(''),[cn,setCn]=useState(''),[bulk,setBulk]=useState(''),[tab,setTab]=useState('analytics');
 const idx=cls[ci]?ci:0,c=cls[idx];
 const upd=f=>setCls(cls.map((x,i)=>i===idx?f(x):x));
 const sts=c?c.students:[],ns=sts.filter(s=>s.nota!=null&&s.nota!==''),avg=ns.length?(ns.reduce((a,s)=>a+ +s.nota,0)/ns.length).toFixed(1):'—';
 const setS=(id,p)=>upd(x=>({...x,students:x.students.map(y=>y.id===id?{...y,...p}:y)}));

     {id:'q4',label:'2.2',text:'Classifique a oração subordinada presente no verso 6 e indique a função sintática. (20 pontos)',max:20,model:'Oração subordinada adjetiva relativa restritiva; função sintática de modificador do nome restritivo.',dom:'GR',chave:'subordinada adjetiva relativa\nmodificador'}
    ]},

    return[String(s.id),{
     p:totP,m:100,

 const an=c?computeClassAnalytics(c,tests,m,crit):null;

 return h`<div class="page-anim"><div class="ph">

 </div>

 <div class="tabs">${cls.map((x,i)=>h`<button key=${x.id} class=${'pill'+(i===idx?' on':'')} onClick=${()=>setCi(i)}>${x.name}</button>`)}</div>

 <details class="sec" style="padding:12px 20px"><summary class="mu" style="font-weight:600"><${Ico} n="plus" s=${16}/> Nova turma</summary>

  </div>

  <div class="tabs" style="margin-top:20px">
   <button class=${'pill'+(tab==='analytics'?' on':'')} onClick=${()=>setTab('analytics')}><${Ico} n="chart" s=${15}/> Dashboard Estatístico da Turma</button>
   <button class=${'pill'+(tab==='list'?' on':'')} onClick=${()=>setTab('list')}><${Ico} n="users" s=${15}/> Lista de Alunos e Notas (${sts.length})</button>
  </div>

  ${tab==='analytics'&&h`<div>
   ${(!an.qStats.length&&!an.validGrades.length)?h`<section class="sec empty">
    <div class="fic"><${Ico} n="chart" s=${26}/></div>
    <h3>Ainda não há dados estatísticos para ${c.name}</h3>

   </section>`:h`<div>
    <section class="sec">

       <div class="eyebrow">Diagnóstico Coletivo · Preparação de Aulas de Revisão</div>

      </div>

     </div>
     ${an.gaps.length?h`<div class="gap-list">${an.gaps.map((g,i)=>h`<div key=${i} class=${'gap-item '+g.sev}>
      <${Ico} n="alert" s=${20}/>
      <div style="flex:1">

        </div>
        <div class=${'bar '+barCls}><i style=${{width:Math.max(4,q.avgPct)+'%'}}></i></div>
       </div>`;
      })}</div>`:h`<p class="mu" style="margin-top:12px">Avalia questões em «Correção» para ver o gráfico por pergunta.</p>`}
     </section>

     <section class="sec" style="margin-top:0">

function Tests({tests,setTests,cls,setTid,go,m,crit}){
 const nw=()=>{setTid(null);go('corr')};
 return h`<div class="page-anim"><div class="ph"><div><h1>Testes e exames</h1><p class="mu">Os testes criados em Correção aparecem aqui, com a turma associada, média (0–20) e exportação direta para Excel/CSV.</p></div><button class="btn" onClick=${nw}><${Ico} n="plus" s=${16}/> Novo teste</button></div>
 ${!tests.length&&h`<div class="sec empty"><div class="fic"><${Ico} n="file" s=${26}/></div><h3>Ainda não há testes</h3><p>Larga o PDF de um teste e a FALPD separa grupos, questões e respostas-modelo.</p><p style="margin-top:14px"><button class="btn" onClick=${nw}>Criar o primeiro teste</button></p></div>`}
 <div class="grid">${tests.map(t=>{const c=cls.find(k=>k.id===t.classId),gs=Object.entries(t.grades||{}),tot=c?c.students.length:0,avg=gs.length?(gs.reduce((a,[,g])=>a+gn(g),0)/gs.length).toFixed(1):'—',pc=tot?Math.min(100,Math.round(gs.length/tot*100)):0;
  const modCount=(t.groups||[]).flatMap(g=>g.qs).filter(q=>q.model&&q.model.trim()).length;

  const lg=lingua(a,known),x=feats(a,q.model,ctx+' '+g.intro,critDom(crit,d),ess,sem,lg,rangeOf(q.text)),e=Math.round(pred(m[d],x)*q.max*2)/2,na=norm(a);
  r[q.id]={x,d,eng:e,llm:null,tg:null,prop:e,tin:'',es:ess.map(it=>({lab:it.lab,hit:it.alts.some(z=>na.includes(z))||!!(sem&&sem.hit[it.lab])})),wrong:x[11],sm:!!sem,lg:{es:lg.es,ps:lg.ps}}}}

  <!-- Secção de Importação em Lote (Batch Upload) + Importação de Respostas-Modelo -->

  <button class="btn" disabled=${!si||!G.length||busy} onClick=${run}>${busy?'A avaliar…':'Avaliar teste'}</button>

/* ===== Laboratório de Texto ===== */
const CW=new Set('porque pois portanto logo assim contudo todavia porem embora visto conquanto enquanto ora'.split(' '));
function LabPage(){
 const[t,setT]=useState(''),T=t.trim();
 const parts=T?t.split(/(\p{L}+(?:-\p{L}+)*)/u):[],ws=parts.filter((_,i)=>i%2),nws=ws.map(norm);
 const sents=(T.match(/[^.!?…]+[.!?…]*/g)||[]).filter(x=>x.trim()),lens=sents.map(x=>wc(x)),uniq=new Set(nws).size;
 const fc={},rep={};nws.forEach(w=>{const f=FIG.find(f=>w.startsWith(f));if(f)fc[f]=(fc[f]||0)+1;if(w.length>4&&!STOP.has(w)&&!CW.has(w))rep[w]=(rep[w]||0)+1});
 const reps=Object.entries(rep).filter(x=>x[1]>2).sort((a,b)=>b[1]-a[1]).slice(0,6),ln=T?lingua(t,null):null;
 const conn=nws.filter(w=>CW.has(w)).length;
 let k=0;const hl=parts.map((x,i)=>{if(!(i%2))return x;const w=norm(x);return FIG.some(f=>w.startsWith(f))?h`<mark class="hf" key=${i}>${x}</mark>`:CW.has(w)?h`<mark class="hc" key=${i}>${x}</mark>`:rep[w]>2&&w.length>4&&!STOP.has(w)?h`<mark class="hr" key=${i}>${x}</mark>`:x});
 return h`<div class="page-anim"><div class="ph"><div><div class="eyebrow">Ferramenta</div><h1>Laboratório de texto</h1><p class="mu">Cola uma composição ou resposta e vê, no próprio texto, as figuras de estilo, os conectores, as repetições e os erros de pontuação. Tudo local.</p></div>${T&&h`<button class="btn g" onClick=${()=>setT('')}>Limpar</button>`}</div>
 <div class="sec" style="margin-top:0"><div class="fld"><label for="lt">Texto</label><textarea id="lt" style="min-height:150px" value=${t} onInput=${e=>setT(e.target.value)} placeholder="Cola aqui o texto do aluno…"></textarea></div></div>
 ${T?h`<div class="stats"><div class="stat"><b>${ws.length}</b><span>palavras</span></div><div class="stat"><b>${sents.length}</b><span>frases · média ${sents.length?Math.round(ws.length/sents.length):0} pal.</span></div><div class="stat"><b>${ws.length?Math.round(uniq/ws.length*100):0}%</b><span>diversidade lexical</span></div><div class="stat"><b>${conn}</b><span>conectores</span></div><div class="stat"><b>${ln.ps.length}</b><span>alertas de pontuação</span></div></div>
 <div class="sec"><div class="chips" style="margin-bottom:12px"><span class="chip or">■ recurso expressivo</span><span class="chip ok">■ conector</span><span class="chip warn">■ palavra repetida</span></div><div class="doc">${hl}</div>
 ${Object.keys(fc).length>0&&h`<div class="chips" style="margin-top:14px">${Object.entries(fc).map(([f,n])=>h`<span class="chip or" key=${f}>${FIGN[f]} ×${n}</span>`)}</div>`}
 ${reps.length>0&&h`<p class="mu" style="margin-top:12px">Mais repetidas: ${reps.map(([w,n])=>w+' ('+n+')').join(', ')}. Frase mais longa: ${Math.max(...lens)} palavras.</p>`}</div>
 <div class="sec"><h3>Pontuação</h3>${ln.ps.length?h`<div class="gap-list">${ln.ps.slice(0,12).map((e,i)=>h`<div class=${'gap-item '+(e.soft?'warn':'crit')} key=${i}><div><b>${e.msg}</b><div class="mu">${e.ctx}</div></div></div>`)}</div>`:h`<div class="note ok">Sem alertas de pontuação.</div>`}
 ${!DICT.sp&&h`<p class="mu" style="margin-top:12px">Ortografia: carrega o dicionário em «Correção» para também verificar a ortografia aqui.</p>`}${ln.es.length>0&&h`<p style="margin-top:12px"><b>Possíveis erros ortográficos:</b> ${ln.es.slice(0,15).map(e=>e.msg.replace('ortografia: ','')).join(', ')}</p>`}</div>`:h`<div class="sec empty"><div class="fic"><${Ico} n="spark" s=${24}/></div><h3>Cola um texto para começar</h3><span>A análise aparece à medida que escreves.</span></div>`}</div>`;
}
/* ===== Detetor de Semelhanças ===== */
function SimPage(){
 const[t,setT]=useState(''),[th,setTh]=useState(35);
 const items=t.split(/\n\s*-{3,}\s*\n/).map((b,i)=>{const L=b.trim().split('\n'),nm=/^.{1,40}:\s*$/.test(L[0])?L.shift().replace(/:\s*$/,''):'Resposta '+(i+1),tx=L.join(' ').trim(),tk=norm(tx).match(/[a-z0-9]+/g)||[],sh=new Set();for(let j=0;j+4<=tk.length;j++)sh.add(tk.slice(j,j+4).join(' '));return{nm,sh,n:tk.length}}).filter(x=>x.n>=8);
 const pairs=[];for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const A=items[i].sh,B=items[j].sh,sh=[...A].filter(x=>B.has(x)),pc=Math.round(sh.length/Math.max(1,Math.min(A.size,B.size))*100);pairs.push({a:items[i].nm,b:items[j].nm,pc,ex:sh.slice(0,3)})}
 pairs.sort((x,y)=>y.pc-x.pc);const hit=pairs.filter(x=>x.pc>=th);
 return h`<div class="page-anim"><div class="ph"><div><div class="eyebrow">Ferramenta</div><h1>Detetor de semelhanças</h1><p class="mu">Compara respostas da mesma questão e assinala pares com sequências de palavras iguais, um sinal de cópia a verificar. Não acusa ninguém: só mostra a evidência.</p></div></div>
 <div class="sec" style="margin-top:0"><div class="fld"><label for="st">Respostas (separa cada uma com uma linha «---»; opcionalmente começa com «Nome:»)</label><textarea id="st" style="min-height:200px" value=${t} onInput=${e=>setT(e.target.value)} placeholder=${'Ana:\nA comparação com a cegonha mostra…\n---\nBruno:\nA comparação com a cegonha mostra…'}></textarea></div>
 <div class="fld" style="max-width:240px;margin-top:12px"><label for="sl">Sinalizar a partir de ${th}%</label><input id="sl" type="range" min="10" max="90" step="5" value=${th} onInput=${e=>setTh(+e.target.value)}/></div></div>
 ${items.length>1?h`<div class="stats"><div class="stat"><b>${items.length}</b><span>respostas lidas</span></div><div class="stat"><b>${pairs.length}</b><span>pares comparados</span></div><div class="stat"><b>${hit.length}</b><span>pares sinalizados</span></div></div>
 ${hit.length?hit.slice(0,15).map((x,i)=>h`<div class="pair" key=${i}><b>${x.a} ↔ ${x.b}</b><span class=${'pc chip '+(x.pc>=60?'err':'warn')}>${x.pc}%</span><div class="bar"><i style=${{width:x.pc+'%'}}></i></div><div class="sh2">Sequências comuns: ${x.ex.map(e=>'«'+e+'»').join(' · ')||'—'}</div></div>`):h`<div class="note ok">Nenhum par acima de ${th}%.</div>`}`:h`<div class="sec empty"><div class="fic"><${Ico} n="layers" s=${24}/></div><h3>Cola pelo menos duas respostas</h3><span>Cada resposta precisa de umas 8 palavras ou mais.</span></div>`}</div>`;
}

function App(){

  :pg==='lab'?h`<${LabPage}/>`

  :h`<${Correct} cls=${cls} setCls=${setCls} crit=${ctext} m=${m} setM=${setM} st=${st} setSt=${setSt} llm=${llm} setLlm=${setLlm} tests=${tests} setTests=${setTests} tid=${tid} setTid=${setTid} go=${go}/>`}
 </main>
 <footer>© 2026 FALPD — Ferramenta de Análise de Literatura Portuguesa para Docentes. Todos os direitos reservados. <span style="opacity:.5">· versão 03-01-batch-stats</span></footer><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${EB}><${App}/><//>`);
</script>
