html
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">
<title>FALPD — Ferramenta de Análise de Literatura Portuguesa para Docentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{--or:#ff6a00;--or2:#ff8c3a;--ord:#c24e00;--ort:#b84700;--onor:#1b120c;--bg:#fffaf5;--sf:#fff;--sf2:#fff4ea;--tx:#2a1a10;--mu:#7a6555;--bd:#f3dfcf;--dk:#1b120c;--dkt:#fff3e8;--ok:#14804a;--okb:rgba(20,128,74,.12);--er:#c62d26;--erb:rgba(198,45,38,.1);--wn:#8a5200;--wnb:rgba(255,170,0,.2);--sh:0 1px 2px rgba(60,30,10,.05),0 10px 28px rgba(60,30,10,.06);--hh:62px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#150e09;--sf:#241a12;--sf2:#2d2118;--tx:#fbeee2;--mu:#c2a994;--bd:#3d2c1f;--dk:#0d0804;--ort:#ff9a55;--ok:#4cd08a;--okb:rgba(76,208,138,.14);--er:#ff8a82;--erb:rgba(255,122,114,.14);--wn:#ffc15a;--wnb:rgba(255,193,90,.14);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 110px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#root{min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.2}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.mu{color:var(--mu);font-size:14px}
.ico{flex:0 0 auto;vertical-align:middle}

/* cabeçalho + navegação */
.top{position:sticky;top:0;z-index:20;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) clamp(14px,3vw,28px) 0;background:var(--sf);box-shadow:0 2px 0 var(--or);display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:1px;cursor:pointer;color:var(--tx);background:none;border:0;padding:0}.brand b{color:var(--or)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--mu);font:600 14px 'Sora',sans-serif;padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s}
.nav button:hover{color:var(--ort);background:rgba(255,106,0,.1)}
.nav button[aria-current=page]{background:var(--or);color:var(--onor)}
.wrap{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:28px clamp(14px,3vw,24px) 56px}
@media(max-width:760px){
 .nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:30;justify-content:space-around;gap:0;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 .nav button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 4px}
 .wrap{padding-bottom:100px}
}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;font:600 14px 'Sora',sans-serif;cursor:pointer;background:var(--or);color:var(--onor);box-shadow:0 3px 0 var(--ord);transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 0 var(--ord),0 8px 18px rgba(255,106,0,.3)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:transparent;color:var(--ort);box-shadow:inset 0 0 0 2px var(--or)}
.btn.g:hover:not(:disabled){background:var(--or);color:var(--onor);box-shadow:inset 0 0 0 2px var(--or)}
.btn.k{background:var(--dk);color:var(--dkt);box-shadow:0 3px 0 #000,inset 0 0 0 1px var(--bd)}
.btn.s{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.lg{padding:14px 26px;font-size:16px;border-radius:12px}
.ibtn{border:0;background:none;color:var(--mu);width:34px;height:34px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;transition:.15s}
.ibtn:hover{background:var(--erb);color:var(--er)}
.lnk{border:0;background:none;color:var(--ort);font:600 13px 'Sora',sans-serif;cursor:pointer;padding:4px 0;text-decoration:underline}

/* títulos de página e secções */
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.01em}
.ph p{margin-top:6px;max-width:62ch}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ort);margin-bottom:6px}
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-top:16px;box-shadow:var(--sh)}
.sec h3{font-size:17px}
.sh{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.sh p{margin-top:2px}
.sn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--dk);color:var(--dkt);display:grid;place-items:center;font-weight:800;font-size:14px}
.land h2{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.01em}
.land .blk{margin-top:56px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.card h3{font-size:16px;margin:10px 0 4px}
.fic{width:42px;height:42px;border-radius:12px;background:rgba(255,106,0,.14);color:var(--ort);display:grid;place-items:center}

/* chips e notas */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--mu);border:1px solid var(--bd);white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok);border-color:transparent}
.chip.err{background:var(--erb);color:var(--er);border-color:transparent}
.chip.warn{background:var(--wnb);color:var(--wn);border-color:transparent}
.chip.or{background:rgba(255,106,0,.14);color:var(--ort);border-color:transparent}
.note{background:rgba(255,106,0,.1);border-left:4px solid var(--or);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px}
.note.ok{background:var(--okb);border-color:var(--ok)}
.note.err{background:var(--erb);border-color:var(--er)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;background:linear-gradient(135deg,var(--dk) 55%,#4a2108);color:var(--dkt);border-radius:28px;padding:clamp(28px,5vw,56px);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;background:var(--or);opacity:.22;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(30px,5vw,50px);font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--or2)}
.hero .lead{font-size:17px;opacity:.88;max-width:50ch;margin:16px 0 26px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.g{color:var(--dkt);box-shadow:inset 0 0 0 2px rgba(255,243,232,.45)}
.hero .btn.g:hover{background:rgba(255,243,232,.14);color:var(--dkt);box-shadow:inset 0 0 0 2px var(--dkt)}
.trust{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:24px;font-size:13px;opacity:.85}
.trust span{display:flex;align-items:center;gap:6px}
.mock{background:var(--sf);color:var(--tx);border-radius:18px;padding:18px;box-shadow:0 24px 50px rgba(0,0,0,.4);transform:rotate(1.5deg)}
.mock .mh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.mock .ms{font-size:44px;font-weight:800;color:var(--ort);line-height:1;margin:12px 0 2px}.mock .ms small{font-size:15px;color:var(--mu);font-weight:600}
.mock .mr{margin:9px 0;font-size:12px}.mock .mr div:first-child{display:flex;justify-content:space-between;color:var(--mu);margin-bottom:3px}
.mock .mt{font-size:11px;color:var(--mu);margin-top:12px;text-align:center}
@media(max-width:860px){.hero{grid-template-columns:1fr}.mock{display:none}}

/* primeiros passos */
.todo{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.todo li{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
.todo li.next{border-color:var(--or);background:rgba(255,106,0,.07)}
.todo .tk{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;color:var(--mu)}
.todo li.done .tk{background:var(--ok);border-color:var(--ok);color:#fff}
.todo li.next .tk{border-color:var(--or);color:var(--ort)}
.todo .tx{flex:1;min-width:0}.todo .tx b{display:block;font-size:14px}.todo li.done .tx b{text-decoration:line-through;opacity:.6}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.step{padding:20px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;position:relative}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--or);color:var(--onor);display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.step h3{font-size:16px;margin-bottom:4px}
.band{background:var(--dk);color:var(--dkt);border-radius:24px;padding:clamp(26px,4vw,44px);text-align:center;border-top:4px solid var(--or)}
.band h2{font-size:clamp(22px,3.4vw,30px)}.band p{opacity:.85;margin:10px auto 22px;max-width:52ch}
.pbar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.pbar i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));transition:width .6s}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}

/* formulários */
label{font-size:12px;font-weight:600;color:var(--mu);display:block;margin:0 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:14px 'Sora',sans-serif;transition:.15s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px rgba(255,106,0,.2)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>.grow{flex:1;min-width:180px}
.inl{display:flex;align-items:center;gap:6px;margin:0;font-size:12px;white-space:nowrap}
.inl input{width:72px;padding:6px 8px}.inl select{width:auto;padding:6px 8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--tx);font-weight:400}.chk input{width:auto}

/* drag and drop */
.drop{border:2px dashed var(--or);border-radius:16px;padding:28px 20px;text-align:center;cursor:pointer;background:rgba(255,106,0,.05);transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ort)}
.drop:hover{background:rgba(255,106,0,.12)}
.drop.over{background:rgba(255,106,0,.18);border-style:solid;transform:scale(1.01);box-shadow:0 0 0 5px rgba(255,106,0,.18)}
.drop.busy{opacity:.7;pointer-events:none}
.drop .dt{font-weight:700;color:var(--tx);font-size:15px}.drop .dh{font-size:13px;color:var(--mu)}
.drop.compact{padding:16px;flex-direction:row;justify-content:center;gap:12px;flex-wrap:wrap}.drop.compact .dt{font-size:14px}
.dbad{color:var(--er);font-size:13px;font-weight:600;width:100%}
.files{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.file{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
.file .fi{flex:1;min-width:0}.file b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .pv{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file>.ico{color:var(--ort)}

/* tabelas, estatísticas */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--ort);line-height:1.1}.stat span{font-size:12px;color:var(--mu)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.pill{padding:7px 16px;border-radius:99px;border:1.5px solid var(--or);color:var(--ort);background:transparent;font:600 13px 'Sora',sans-serif;cursor:pointer;transition:.15s}
.pill:hover,.pill.on{background:var(--or);color:var(--onor)}
.pill.add{border-style:dashed}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;margin-top:14px}
table{width:100%;border-collapse:collapse}
th{background:var(--dk);color:var(--dkt);text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
td{padding:6px 12px;border-top:1px solid var(--bd)}
tbody tr:hover td{background:rgba(255,106,0,.06)}
.who{display:flex;align-items:center;gap:10px}
.av{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:rgba(255,106,0,.18);color:var(--ort);display:grid;place-items:center;font-size:12px;font-weight:800}
.who input,.nota{border-color:transparent;background:transparent;padding:6px 8px}
.who input:hover,.nota:hover{border-color:var(--bd)}.nota{max-width:90px}
.ta{text-align:right;width:50px}
.empty{text-align:center;padding:36px 20px;color:var(--mu)}.empty .fic{margin:0 auto 12px;width:54px;height:54px}.empty h3{color:var(--tx);margin-bottom:4px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details.adv{margin-top:12px}details.adv>summary{font-size:13px;font-weight:600;color:var(--mu);display:flex;align-items:center;gap:6px}
details.adv>summary:before{content:"▸";transition:.15s}details.adv[open]>summary:before{transform:rotate(90deg)}
details.adv>summary:hover{color:var(--ort)}details.adv>div,details.adv>p,details.adv>textarea{margin-top:8px}

/* correção */
.tinfo .top2{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.tinfo h2{font-size:22px;margin-bottom:8px}
.perf{display:flex;gap:10px}.perf .stat{padding:8px 14px}.perf .stat b{font-size:20px}
.abar{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 8px);z-index:10;background:var(--sf);border:1px solid var(--or);border-radius:16px;padding:12px 14px;margin-top:16px;box-shadow:var(--sh)}
.abar .r1{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.abar .fld{flex:1;min-width:180px;max-width:340px}
.abar .sp{flex:1}
.tot{display:flex;align-items:center;gap:8px;line-height:1.2}.tot .mu{font-size:12px}
.score{font-size:40px;font-weight:800;color:var(--ort);line-height:1}
.qnav{display:flex;gap:6px;overflow-x:auto;padding-top:10px;margin-top:10px;border-top:1px solid var(--bd)}
.qc{flex:0 0 auto;min-width:40px;padding:4px 10px;border-radius:8px;border:1.5px solid var(--bd);background:var(--bg);font:600 12px 'Sora',sans-serif;color:var(--mu);cursor:pointer}
.qc.ev{border-color:var(--or);color:var(--ort)}.qc.dn{background:var(--ok);border-color:var(--ok);color:#fff}
.hint{margin-top:10px;font-size:13px}
@media(max-width:760px){.abar{position:static}}
.eng>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eng .sum-t{display:flex;gap:8px;align-items:center;font-weight:700}
.engrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.ec{border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.ec .ech{display:flex;justify-content:space-between;align-items:center;gap:8px}.ec p{flex:1}.ec .fields{grid-template-columns:1fr}
.sech{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-top:32px}.sech h2{font-size:22px}
.gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px;padding-bottom:8px;border-bottom:2px solid var(--or)}
.gh h3{font-size:18px;color:var(--ort)}
.q{background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin-top:14px;overflow:hidden;box-shadow:var(--sh)}
.qh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--sf2);border-bottom:1px solid var(--bd)}
.qb{padding:16px}
.qbadge{background:var(--dk);color:var(--dkt);border-radius:8px;padding:3px 12px;font-weight:800;font-size:13px}
.qlab{max-width:90px;padding:6px 8px}
.qmeta{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stmt{background:var(--bg);border-left:4px solid var(--or);border-radius:8px;padding:10px 14px;font-size:14px;white-space:pre-wrap}
.stmt.cl{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.lh{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}.lh label{margin:0}.lh span{font-size:12px;color:var(--mu)}
.res{margin-top:16px;padding:16px;border-radius:14px;background:var(--sf2);border:1px solid var(--bd)}
.rtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.rtop .score{font-size:34px}.rtop .of{color:var(--mu);font-weight:600}
.res p{margin-top:10px;font-size:13px}
.grade{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:14px;padding-top:14px;border-top:1px dashed var(--bd)}.grade .grow{flex:1;min-width:200px}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 22px}
.pl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mu);margin-bottom:3px}
.ll{font-size:13px;margin-top:4px;color:var(--mu)}
footer{background:var(--dk);color:var(--dkt);text-align:center;padding:18px 18px 24px;font-size:13px;border-top:4px solid var(--or)}
@media(max-width:760px){footer{padding-bottom:90px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const AT={class:'className',for:'htmlFor',tabindex:'tabIndex',autoplay:'autoPlay',playsinline:'playsInline'};
const ce=(t,p,...c)=>{if(p){const q={};for(const k in p)q[AT[k]||k]=p[k];if(typeof q.style==='string')q.style=Object.fromEntries(q.style.split(';').filter(s=>s.includes(':')).map(s=>{const[k,...v]=s.split(':');return[k.trim().replace(/-([a-z])/g,(_,x)=>x.toUpperCase()),v.join(':').trim()]}));p=q}return React.createElement(t,p,...c)};
const h=htm.bind(ce);
class EB extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?h`<main class="wrap"><div class="note err">Ocorreu um erro: ${String(this.state.e.message||this.state.e)}</div><p style="margin-top:12px"><button class="btn" onClick=${()=>this.setState({e:null})}>Tentar de novo</button></p></main>`:this.props.children}}
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}

/* Zona de largar PDFs: arrastar, clicar ou teclado (Enter/Espaço) */
function DropZone({multi,busy,onFiles,title,hint,compact}){
 const[over,setOver]=useState(false),[bad,setBad]=useState(''),r=useRef(),n=useRef(0);
 const take=list=>{const all=[...list],ok=all.filter(isPdf);setBad(all.length&&ok.length<all.length?(ok.length?'Ignorei '+(all.length-ok.length)+' ficheiro(s) que não são PDF.':'Só são aceites ficheiros PDF.'):'');if(ok.length)onFiles(multi?ok:ok.slice(0,1))};
 const dp=e=>{e.preventDefault();e.stopPropagation()};
 return h`<div class=${'drop'+(over?' over':'')+(compact?' compact':'')+(busy?' busy':'')} role="button" tabindex="0" aria-label=${title}
  onClick=${()=>r.current.click()} onKeyDown=${e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();r.current.click()}}}
  onDragEnter=${e=>{dp(e);n.current++;setOver(true)}} onDragOver=${e=>{dp(e);if(e.dataTransfer)e.dataTransfer.dropEffect='copy'}}
  onDragLeave=${e=>{dp(e);n.current=Math.max(0,n.current-1);if(!n.current)setOver(false)}}
  onDrop=${e=>{dp(e);n.current=0;setOver(false);take(e.dataTransfer.files)}}>
  <${Ico} n="up" s=${compact?22:32}/>
  <div class="dt">${busy?'A ler PDF…':over?'Larga aqui para carregar':title}</div>
  <div class="dh">${hint}</div>
  ${bad&&h`<div class="dbad" role="alert">${bad}</div>`}
  <input ref=${r} type="file" accept="application/pdf,.pdf" multiple=${!!multi} hidden onClick=${e=>e.stopPropagation()} onChange=${e=>{take(e.target.files);e.target.value=''}}/>
 </div>`;
}
/* Zona de largar + leitura dos PDFs + lista de ficheiros carregados */
function PdfInput({multi,items,onAdd,onDel,title,hint,compact,max=150000,preview}){
 const[busy,setBusy]=useState(false),[err,setErr]=useState('');
 const go=async fl=>{setBusy(true);setErr('');for(const f of fl){try{onAdd({name:f.name,text:(await pdfText(f)).slice(0,max)})}catch(x){setErr('Não foi possível ler «'+f.name+'»: '+(x&&x.message?x.message:x)+'.')}}setBusy(false)};
 return h`<div><${DropZone} multi=${multi} busy=${busy} onFiles=${go} title=${title} hint=${hint} compact=${compact}/>
  ${err&&h`<div class="note err" role="alert">${err}</div>`}
  ${items.length>0&&h`<ul class="files">${items.map((d,i)=>h`<li class="file" key=${i}><${Ico} n="file" s=${22}/><div class="fi"><b title=${d.name}>${d.name}</b>
   <span class="mu">${fmtN(d.text.length)} caracteres lidos</span>${d.text.trim().length<30&&h` <span class="chip warn">sem texto — pode ser uma digitalização</span>`}
   ${preview&&d.text.trim().length>=30&&h`<div class="pv">${d.text.slice(0,160)}…</div>`}</div>
   <button class="ibtn" aria-label=${'Remover '+d.name} onClick=${()=>onDel(i)}><${Ico} n="x"/></button></li>`)}</ul>`}</div>`;
}
function Clamp({text}){const[o,setO]=useState(false),long=text.length>260;return h`<div><div class=${'stmt'+(long&&!o?' cl':'')}>${text||'(sem enunciado)'}</div>${long&&h`<button class="lnk" onClick=${()=>setO(!o)}>${o?'Mostrar menos':'Ver enunciado completo'}</button>`}</div>`}

/* ===== Turmas ===== */
function Dash({cls,setCls}){
 const[ci,setCi]=useState(0),[nm,setNm]=useState(''),[cn,setCn]=useState(''),[bulk,setBulk]=useState('');
 const idx=cls[ci]?ci:0,c=cls[idx];
 const upd=f=>setCls(cls.map((x,i)=>i===idx?f(x):x));
 const sts=c?c.students:[],ns=sts.filter(s=>s.nota!=null&&s.nota!==''),avg=ns.length?(ns.reduce((a,s)=>a+ +s.nota,0)/ns.length).toFixed(1):'—';
 const setS=(id,p)=>upd(x=>({...x,students:x.students.map(y=>y.id===id?{...y,...p}:y)}));
 const addC=()=>{if(cn.trim()){setCls([...cls,{id:Date.now(),name:cn.trim(),students:[]}]);setCi(cls.length);setCn('')}};
 const addS=()=>{if(nm.trim()){upd(x=>({...x,students:[...x.students,{id:Date.now(),name:nm.trim(),nota:null}]}));setNm('')}};
 const addB=()=>{const L=bulk.split('\n').map(x=>x.trim()).filter(Boolean);if(L.length){const t=Date.now();upd(x=>({...x,students:[...x.students,...L.map((name,i)=>({id:t+i,name,nota:null}))]}));setBulk('')}};
 const enter=f=>e=>{if(e.key==='Enter'){e.preventDefault();f()}};
 return h`<div><div class="ph"><div><h1>Turmas</h1><p class="mu">Alunos e notas do último teste de literatura (0–20). As notas são preenchidas ao guardar uma correção, mas podes editá-las aqui.</p></div></div>
 <div class="tabs">${cls.map((x,i)=>h`<button key=${x.id} class=${'pill'+(i===idx?' on':'')} onClick=${()=>setCi(i)}>${x.name}</button>`)}</div>
 <details class="sec" style="padding:12px 20px"><summary class="mu" style="font-weight:600"><${Ico} n="plus" s=${16}/> Nova turma</summary>
  <div class="row" style="margin-top:12px"><div class="grow"><label for="nt">Nome da turma</label><input id="nt" placeholder="Ex.: 12.º B" value=${cn} onInput=${e=>setCn(e.target.value)} onKeyDown=${enter(addC)}/></div><button class="btn" onClick=${addC}>Criar turma</button></div></details>
 ${c&&h`<div>
  <div class="stats"><div class="stat"><b>${sts.length}</b><span>alunos</span></div><div class="stat"><b>${ns.length}</b><span>com nota</span></div><div class="stat"><b>${avg}</b><span>média da turma</span></div></div>
  <section class="sec"><div class="row" style="justify-content:space-between;align-items:center"><h3>${c.name}</h3>
   ${cls.length>1&&h`<button class="btn k s" onClick=${()=>{if(confirm('Remover a turma '+c.name+'?')){setCls(cls.filter((_,i)=>i!==idx));setCi(0)}}}><${Ico} n="trash" s=${14}/> Remover turma</button>`}</div>
   ${sts.length?h`<div class="tw"><table><thead><tr><th>Aluno</th><th>Nota (0–20)</th><th></th></tr></thead><tbody>${sts.map(s=>h`<tr key=${s.id}>
    <td><div class="who"><span class="av">${ini(s.name)}</span><input aria-label="Nome do aluno" value=${s.name} onInput=${e=>setS(s.id,{name:e.target.value})}/></div></td>
    <td><input class="nota" aria-label=${'Nota de '+s.name} type="number" min="0" max="20" step="0.1" placeholder="—" value=${s.nota??''} onInput=${e=>setS(s.id,{nota:e.target.value})}/></td>
    <td class="ta"><button class="ibtn" aria-label=${'Remover '+s.name} onClick=${()=>upd(x=>({...x,students:x.students.filter(y=>y.id!==s.id)}))}><${Ico} n="trash"/></button></td></tr>`)}</tbody></table></div>`
   :h`<div class="empty"><div class="fic"><${Ico} n="users" s=${26}/></div><h3>Ainda não há alunos</h3><p>Adiciona o primeiro abaixo, ou cola uma lista de nomes.</p></div>`}
   <div class="row" style="margin-top:16px"><div class="grow"><label for="na">Novo aluno</label><input id="na" placeholder="Nome do aluno" value=${nm} onInput=${e=>setNm(e.target.value)} onKeyDown=${enter(addS)}/></div><button class="btn" onClick=${addS}><${Ico} n="plus" s=${16}/> Aluno</button></div>

  </section></div>`}</div>`;
}

 return h`<details class="sec eng"><summary><span class="sum-t"><${Ico} n="spark" s=${18}/> Motor de análise</span>
  <span class="chips"><span class="chip ok">✔ Pontuação</span>${chip(db==='ok','Dicionário')}${chip(eb==='ok','Semântica')}${chip(!!llm.key,'2.ª opinião')}</span></summary>
  <div class="engrid">
   <div class="ec"><div class="ech"><b>Dicionário</b>${stt(db)}</div><p class="mu">A pontuação é sempre verificada com regras. O dicionário (~1,5 MB) acrescenta a ortografia. Não deteta erros de concordância e pode apontar casos legítimos: os avisos servem para rever.</p>
    <div><button class="btn s" disabled=${db==='load'||db==='ok'} onClick=${onDict}>${db==='ok'?'Dicionário carregado':db==='load'?'A carregar…':'Ativar dicionário'}</button></div>${dbm&&h`<div class="note err">${dbm}</div>`}</div>
   <div class="ec"><div class="ech"><b>Análise semântica local</b>${stt(eb)}</div><p class="mu">Um pequeno modelo (~120 MB) mede a proximidade de sentido entre frases, mesmo com palavras diferentes. Corre neste navegador e não é um LLM. Não distingue bem figuras de estilo parecidas: para isso servem os elementos essenciais.</p>
    <div><button class="btn s" disabled=${eb==='load'||eb==='ok'} onClick=${onEmb}>${eb==='ok'?'Modelo carregado':eb==='load'?'A carregar…':'Ativar análise semântica'}</button></div>${ebm&&h`<div class="note ${eb==='err'?'err':''}">${ebm}</div>`}</div>
   <div class="ec"><div class="ech"><b>Segunda opinião (LLM)</b>${llm.key?h`<span class="chip ok">chave definida</span>`:h`<span class="chip">opcional</span>`}</div>
    <div class="fields"><div><label for="lp">Fornecedor</label><select id="lp" value=${llm.prov} onChange=${e=>setLlm({...llm,prov:e.target.value})}><option value="gemini">Gemini (chave gratuita do AI Studio)</option><option value="claude">Claude (Anthropic)</option></select></div>
    <div><label for="lk">Chave da API</label><input id="lk" type="password" autocomplete="off" value=${llm.key} onInput=${e=>setLlm({...llm,key:e.target.value})}/></div>
    <div><label for="lm">Modelo (opcional)</label><input id="lm" value=${llm.model} onInput=${e=>setLlm({...llm,model:e.target.value})} placeholder=${llm.prov==='claude'?'claude-sonnet-5-5':'gemini-flash-latest'}/></div></div>
    <p class="mu">O LLM só sugere uma nota; a nota final é sempre tua. São enviados ao fornecedor: critérios de Português, teste, contexto, resposta-modelo e resposta do aluno (sem nomes). A chave fica só neste navegador.</p></div>
  </div></details>`;
}

/* ===== Correção ===== */
function Correct({cls,setCls,crit,m,setM,st,setSt,llm,setLlm,tests,setTests,tid,setTid}){
 const t=tests.find(x=>x.id===tid);
 const[si,setSi]=useState(''),[ed,setEd]=useState(false),[rs,setRs]=useState({}),[saved,setSaved]=useState(false),[busy,setBusy]=useState(false),[err,setErr]=useState(''),[eb,setEb]=useState(EMB.ext?'ok':'off'),[ebm,setEbm]=useState('');
 const onEmb=async()=>{setEb('load');setEbm('A preparar…');try{await loadEmb(setEbm);setEb('ok');setEbm('');try{localStorage.setItem('phalpd_emb','1')}catch(e){}}catch(e){setEb('err');setEbm('Não foi possível carregar o modelo ('+(e.message||e)+'). Só funciona na versão alojada (https) e com internet.')}};
 useEffect(()=>{try{if(!EMB.ext&&localStorage.getItem('phalpd_emb')==='1')onEmb()}catch(e){}},[]);
 const[db,setDb]=useState(DICT.sp?'ok':'off'),[dbm,setDbm]=useState('');
 const onDict=async()=>{setDb('load');setDbm('A preparar…');try{await loadDict(setDbm);setDb('ok');setDbm('');try{localStorage.setItem('phalpd_dic','1')}catch(e){}}catch(e){setDb('err');setDbm('Não foi possível carregar o dicionário ('+(e.message||e)+'). Só funciona na versão alojada (https) e com internet.')}};
 useEffect(()=>{try{if(!DICT.sp&&localStorage.getItem('phalpd_dic')==='1')onDict()}catch(e){}},[]);
 const c=t&&cls.find(k=>k.id===t.classId),ctx=t?ctxOf(t,tests):'',G=(t&&t.groups)||[],AQ=G.flatMap(g=>g.qs.map(q=>({g,q})));
 const extra=t&&t.reuse?tests.filter(o=>o.id!==t.id&&norm(o.author)===norm(t.author)).reduce((a,o)=>a+o.ctx.length,0):0;
 const upT=f=>setTests(tests.map(o=>o.id===t.id?f(o):o));
 const upG=(gid,p)=>upT(o=>({...o,groups:o.groups.map(g=>g.id===gid?{...g,...p}:g)}));
 const upQ=(gid,qid,p)=>upT(o=>({...o,groups:o.groups.map(g=>g.id===gid?{...g,qs:g.qs.map(q=>q.id===qid?{...q,...p}:q)}:g)}));
 const ans=qid=>((t.answers||{})[si]||{})[qid]||'';
 const setAns=(qid,v)=>upT(o=>({...o,answers:{...(o.answers||{}),[si]:{...((o.answers||{})[si]||{}),[qid]:v}}}));
 const pick=v=>{setSi(v);setRs({});setSaved(false);setErr('')};
 const lam=st.nl<3?.3:Math.min(.6,Math.max(.1,st.eE/(st.eE+st.eL+1e-6)));
 const mix=(a,b)=>Math.round(((1-lam)*a+lam*b)*2)/2;
 const cf=(es,el)=>{const cx=[];(el||[]).forEach(z=>{const nz=norm(z.nome);const it=es.find(i=>{const ni=norm(i.lab);return ni&&(nz.includes(ni)||ni.includes(nz))});if(it&&it.hit!==z.presente)cx.push(it.lab)});return cx};
 const fin=e=>e.tg!=null?e.tg:e.prop;
 const run=async()=>{setBusy(true);const r={},known=new Set(norm([t.paper?t.paper.text:'',ctx,...G.map(g=>g.intro+' '+g.qs.map(q=>q.text+' '+q.model).join(' '))].join(' ')).match(/[a-z]{3,}/g)||[]);
  for(const{g,q}of AQ){const a=ans(q.id);if(q.model&&q.model.trim()&&a.trim()){const d=qdom(q),ess=essOf(q);let sem=null;if(EMB.ext){try{sem=await semOf(a,q.model,ess)}catch(e){}}
   const lg=lingua(a,known),x=feats(a,q.model,ctx+' '+g.intro,critDom(crit,d),ess,sem,lg,rangeOf(q.text)),e=Math.round(pred(m[d],x)*q.max*2)/2,na=norm(a);
   r[q.id]={x,d,eng:e,llm:null,tg:null,prop:e,tin:'',es:ess.map(it=>({lab:it.lab,hit:it.alts.some(z=>na.includes(z))||!!(sem&&sem.hit[it.lab])})),wrong:x[11],sm:!!sem,lg:{es:lg.es,ps:lg.ps}}}}
  setRs(r);setSaved(false);setBusy(false);setErr(Object.keys(r).length?'':'Preenche a resposta-modelo e a resposta do aluno em pelo menos uma questão.')};
 const ask=async()=>{if(!llm.key){setErr('Define a chave da API em «Motor de análise → Segunda opinião».');return}setBusy(true);setErr('');const r={...rs};
  for(const{g,q}of AQ){const e=rs[q.id];if(!e)continue;try{const o=await opinion(llm,{crit:critDom(crit,e.d),paper:t.paper?t.paper.text:'',ctx,intro:g.intro,q,ans:ans(q.id),ess:essOf(q).map(i=>i.lab).join('; ')});r[q.id]={...e,llm:o,prop:mix(e.eng,o.nota),cx:cf(e.es,o.el)};setRs({...r})}catch(x){setErr('Erro da API: '+x.message);break}}
  setBusy(false)};
 const reg=qid=>{const e=rs[qid],q=AQ.find(a=>a.q.id===qid).q,v=e.tin!==''?+e.tin:e.prop;if(isNaN(v))return;const g=Math.max(0,Math.min(q.max,v));
  setM({...m,[e.d]:train(m[e.d],e.x,g/q.max)});
  setSt({ok:(st.ok||0)+(Math.abs(e.eng-g)<=.1*q.max?1:0),n:st.n+1,eE:(st.eE*st.n+Math.abs(e.eng-g)/q.max)/(st.n+1),nl:st.nl+(e.llm?1:0),eL:e.llm?(st.eL*st.nl+Math.abs(e.llm.nota-g)/q.max)/(st.nl+1):st.eL});
  setRs({...rs,[qid]:{...e,tg:g}});setSaved(false)};
 const ev=AQ.filter(({q})=>rs[q.id]),P=ev.reduce((a,{q})=>a+fin(rs[q.id]),0),M=ev.reduce((a,{q})=>a+q.max,0),pend=ev.some(({q})=>rs[q.id].tg==null);
 const save=()=>{const nt=(P/M*20).toFixed(1);setCls(cls.map(k=>k.id===t.classId?{...k,students:k.students.map(s=>String(s.id)===si?{...s,nota:nt}:s)}:k));upT(o=>({...o,grades:{...o.grades,[si]:{p:P,m:M}}}));setSaved(true)};
 const rp=()=>upT(o=>{const old=o.groups||[];return{...o,groups:parseTest(o.paper.text).map(g=>({...g,qs:g.qs.map(q=>{const og=old.find(x=>x.name===g.name),oq=og&&og.qs.find(x=>x.label===q.label);return oq?{...q,model:oq.model,max:oq.max}:q})}))}});
 const withModel=AQ.filter(({q})=>q.model&&q.model.trim()).length;
 const goQ=id=>{const e=document.getElementById('q-'+id);e&&e.scrollIntoView({behavior:'smooth',block:'start'})};
 const qs=q=>{const r=rs[q.id];return r?(r.tg!=null?'dn':'ev'):''};

 const Res=(q,r)=>h`<div class="res">
  <div class="rtop"><div><span class="score">${fin(r)}</span> <span class="of">/ ${q.max}</span></div>
   <div class="chips">${r.tg!=null?h`<span class="chip ok">✔ Nota registada</span>`:h`<span class="chip or">Proposta · por confirmar</span>`}
    <span class="chip">Motor ${r.eng}</span>${r.llm&&h`<span class="chip">LLM ${r.llm.nota} · proposta ${r.prop}</span>`}${r.sm&&h`<span class="chip">semântica</span>`}
    ${r.llm&&Math.abs(r.eng-r.llm.nota)/q.max>.25&&h`<span class="chip warn">divergência — rever</span>`}</div></div>
  ${r.llm&&h`<p><b>2.ª opinião:</b> ${r.llm.just}</p>`}
  ${(r.es.length>0||r.wrong>0)&&h`<div style="margin-top:12px"><label>Elementos essenciais</label><div class="chips">${r.es.map(e=>h`<span key=${e.lab} class=${'chip '+(e.hit?'ok':'err')}>${e.hit?'✔ ':'✘ '}${e.lab}</span>`)}${r.wrong?h`<span class="chip warn">figura de estilo diferente da do modelo</span>`:null}</div></div>`}
  ${r.llm&&h`<p class="ll">${r.cx.length?'⚠ Motor e LLM discordam em: '+r.cx.join(', ')+' — rever com atenção.':'Motor e LLM concordam nos elementos verificados.'}${r.llm.el.length?' · LLM: '+r.llm.el.map(z=>(z.presente?'✔ ':'✘ ')+z.nome).join(' · '):''}</p>`}
  <div class="grade"><div class="grow"><label for=${'tin-'+q.id}>A tua nota (proposta ${r.prop})</label><input id=${'tin-'+q.id} type="number" step="0.5" min="0" max=${q.max} placeholder=${'Vazio = aceitar '+r.prop} value=${r.tin} onInput=${e=>setRs({...rs,[q.id]:{...r,tin:e.target.value}})}/></div>
   <button class="btn" onClick=${()=>reg(q.id)}>${r.tg!=null?'Registar de novo':'Registar nota'}</button></div>
  ${r.lg&&(r.lg.es.length+r.lg.ps.length>0)&&h`<details class="adv"><summary>Correção linguística: ${r.lg.es.length} de ortografia · ${r.lg.ps.length} de pontuação (para rever)</summary><div>${[...r.lg.es,...r.lg.ps].slice(0,25).map((e,i)=>h`<div key=${i} class="mu">• ${e.soft?'(aviso) ':''}${e.msg} <i>${e.ctx}</i></div>`)}</div></details>`}
  <details class="adv"><summary>Parâmetros do motor (${FN.length})</summary><div class="params">${FN.map((f,i)=>h`<div key=${f}><div class="pl"><span>${f}</span><span>peso ${m[r.d].w[i].toFixed(2)}</span></div><div class="bar"><i style=${{width:Math.round(Math.max(0,Math.min(1,r.x[i]))*100)+'%'}}></i></div></div>`)}</div></details></div>`;

 const Q=(g,q)=>{const r=rs[q.id],a=si?ans(q.id):'',rg=rangeOf(q.text),noM=!(q.model&&q.model.trim());
  return h`<article class="q" id=${'q-'+q.id} key=${q.id}>
  <div class="qh">${ed?h`<input class="qlab" aria-label="Número da questão" value=${q.label} onInput=${e=>upQ(g.id,q.id,{label:e.target.value})}/>`:h`<span class="qbadge">Questão ${q.label}</span>`}
   ${r?(r.tg!=null?h`<span class="chip ok">Nota registada</span>`:h`<span class="chip or">Proposta por confirmar</span>`):noM?h`<span class="chip warn">Falta resposta-modelo</span>`:null}
   <div class="qmeta"><label class="inl">Cotação <input type="number" min="1" value=${q.max} onInput=${e=>upQ(g.id,q.id,{max:+e.target.value||1})}/> pts</label>
    <label class="inl">Domínio <select value=${qdom(q)} onChange=${e=>upQ(g.id,q.id,{dom:e.target.value})}>${Object.entries(DOMN).map(([k,v])=>h`<option key=${k} value=${k}>${v}</option>`)}</select></label>
    ${ed&&h`<button class="btn k s" onClick=${()=>upG(g.id,{qs:g.qs.filter(x=>x.id!==q.id)})}>Remover</button>`}</div></div>
  <div class="qb">
   ${ed?h`<div><label>Enunciado</label><textarea value=${q.text} onInput=${e=>upQ(g.id,q.id,{text:e.target.value})}></textarea></div>`:h`<${Clamp} text=${q.text}/>`}
   <div class="two"><div><div class="lh"><label for=${'m-'+q.id}>Resposta-modelo</label><span>igual para todos os alunos</span></div><textarea id=${'m-'+q.id} value=${q.model} onInput=${e=>upQ(g.id,q.id,{model:e.target.value})}></textarea></div>
    <div><div class="lh"><label for=${'a-'+q.id}>Resposta do aluno</label>${si&&h`<span>${wc(a)} palavras${rg?' · pedidas '+rg[0]+'–'+rg[1]:''}</span>`}</div>
     ${si?h`<textarea id=${'a-'+q.id} value=${a} onInput=${e=>setAns(q.id,e.target.value)} placeholder="Cola ou escreve a resposta"></textarea>`:h`<div class="note">Escolhe um aluno na barra acima para escrever a resposta.</div>`}</div></div>
   <details class="adv" open=${!!q.chave}><summary>Elementos essenciais (opcional)</summary><p class="mu">Um por linha; sinónimos com | ; peso com :: (ex.: comparação | símile :: 3). Se estiver vazio, usa as figuras de estilo da resposta-modelo.</p>
    <textarea style=${{minHeight:'70px'}} value=${q.chave||''} onInput=${e=>upQ(g.id,q.id,{chave:e.target.value})}></textarea></details>
   ${r&&Res(q,r)}</div></article>`};

 return h`<div><div class="ph"><div><h1>Correção</h1><p class="mu">Escolhe um teste, escolhe um aluno, cola as respostas e avalia.</p></div></div>
 <div class="tabs">${tests.map(x=>h`<button key=${x.id} class=${'pill'+(x.id===tid?' on':'')} onClick=${()=>{setTid(x.id);pick('')}}>${x.name}</button>`)}<button class=${'pill add'+(!t?' on':'')} onClick=${()=>setTid(null)}>+ Novo teste</button></div>
 ${!t?h`<${NewTest} cls=${cls} tests=${tests} onCreate=${x=>{setTests([...tests,x]);setTid(x.id)}}/>`:h`<div>
  <section class="sec tinfo"><div class="top2"><div><h2>${t.name}</h2><div class="chips"><span class="chip">${c?c.name:'turma removida'}</span><span class="chip">${t.author||'sem autor'}</span><span class="chip">contexto: ${t.ctx.length} PDF(s)${extra>0?' + '+extra+' reutilizado(s)':''}</span></div></div>
   <div class="perf"><div class="stat" title="Diferença média entre a proposta do motor e a tua nota, em % da cotação"><b>${st.n?(st.eE*100).toFixed(0)+'%':'—'}</b><span>erro médio do motor</span></div>
    <div class="stat" title="Propostas dentro de ±10% da cotação"><b>${st.ok||0}/${st.n}</b><span>concordância ±10%</span></div>${st.nl?h`<div class="stat"><b>${(st.eL*100).toFixed(0)}%</b><span>erro do LLM</span></div>`:null}</div></div>
   ${!crit&&h`<div class="note">Sem critérios carregados (menu Critérios) a precisão desce.</div>`}</section>

  <div class="abar"><div class="r1">
   <div class="fld"><label for="sel-al">Aluno</label><select id="sel-al" value=${si} onChange=${e=>pick(e.target.value)}><option value="">— escolhe um aluno —</option>${(c?c.students:[]).map(s=>h`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select></div>
   <button class="btn" disabled=${!si||!G.length||busy} onClick=${run}>${busy?'A avaliar…':'Avaliar teste'}</button>
   ${Object.keys(rs).length>0&&h`<button class="btn k" disabled=${busy} onClick=${ask}>2.ª opinião (LLM)</button>`}
   <span class="sp"></span>
   ${ev.length>0&&h`<div class="tot"><span class="score">${(P/M*20).toFixed(1)}</span><span class="mu">/ 20<br/>${P}/${M} pts${pend?' · provisória':''}</span></div><button class="btn" disabled=${saved} onClick=${save}>${saved?'Nota guardada ✔':'Guardar nota'}</button>`}
   </div>
   ${!si&&G.length>0&&h`<p class="mu hint">Escolhe um aluno para começar. Depois cola as respostas e carrega em «Avaliar teste».</p>`}
   ${err&&h`<div class="note err" role="alert">${err}</div>`}
   ${AQ.length>1&&h`<div class="qnav" aria-label="Ir para a questão">${AQ.map(({q})=>h`<button key=${q.id} class=${'qc '+qs(q)} onClick=${()=>goQ(q.id)} title=${'Questão '+q.label}>${q.label}</button>`)}</div>`}</div>

  <${EnginePanel} db=${db} dbm=${dbm} onDict=${onDict} eb=${eb} ebm=${ebm} onEmb=${onEmb} llm=${llm} setLlm=${setLlm}/>

   <div class="row"><button class="btn g s" onClick=${()=>setEd(!ed)}>${ed?'Concluir edição':'Editar estrutura'}</button>${t.paper&&h`<button class="btn g s" onClick=${rp}>Reler estrutura do PDF</button>`}</div></div>
  ${t.paper&&h`<details class="adv"><summary>Texto lido do PDF do teste (${fmtN(t.paper.text.length)} caracteres)</summary><div class="mu" style=${{whiteSpace:'pre-wrap',maxHeight:'200px',overflow:'auto'}}>${t.paper.text.slice(0,1500)}</div></details>`}
  ${!G.length&&h`<div class="note">Sem questões. ${t.paper?'Carrega em «Reler estrutura do PDF» (só funciona com PDFs com texto).':'Este teste não tem PDF: usa «Editar estrutura» para criar grupos e questões.'}</div>`}

  ${G.map(g=>h`<section key=${g.id}>
   <div class="gh">${ed?h`<input style=${{maxWidth:'260px'}} aria-label="Nome do grupo" value=${g.name} onInput=${e=>upG(g.id,{name:e.target.value})}/><button class="btn k s" onClick=${()=>upT(o=>({...o,groups:o.groups.filter(x=>x.id!==g.id)}))}>Remover grupo</button>`:h`<h3>${g.name}</h3>`}

   ${g.qs.map(q=>Q(g,q))}

  ${ed&&h`<p style="margin-top:20px"><button class="btn g" onClick=${()=>upT(o=>({...o,groups:[...(o.groups||[]),{id:'g'+Date.now(),name:'Grupo',intro:'',qs:[]}]}))}>+ Grupo</button></p>`}
 </div>`}</div>`;
}

/* ===== App ===== */
function App(){
 const[pg,setPg]=useState('inicio'),[tid,setTid]=useState(null);
 const[cls,setCls]=usePersist('phalpd_cls',[{id:1,name:'12.º A',students:[]}]);
 const[m,setM]=usePersist('phalpd_model5',MD0);
 const[st,setSt]=usePersist('phalpd_stats',{n:0,eE:0,nl:0,eL:0});
 const[llm,setLlm]=usePersist('phalpd_llm',{prov:'gemini',key:'',model:''});
 const[docs,setDocs]=usePersist('phalpd_docs',{crit:[]});
 const[tests,setTests]=usePersist('phalpd_tests',[]);
 const crit=docs.crit||[],ctext=crit.map(d=>d.text).join('\n'),pp=ptPages(ctext);
 const nfb=Object.values(m).reduce((a,x)=>a+x.n,0);
 /* evita que o navegador abra o PDF se for largado fora de uma zona */
 useEffect(()=>{const p=e=>e.preventDefault();window.addEventListener('dragover',p);window.addEventListener('drop',p);return()=>{window.removeEventListener('dragover',p);window.removeEventListener('drop',p)}},[]);
 const go=p=>{setPg(p);window.scrollTo({top:0})};
 return h`<${React.Fragment}>
 <header class="top"><button class="brand" onClick=${()=>go('inicio')} aria-label="FALPD — início"><${Logo} s=${36}/><span>F<b>ALPD</b></span></button>
  <nav class="nav" aria-label="Principal">${NAV.map(([k,t,i])=>h`<button key=${k} aria-current=${pg===k?'page':undefined} onClick=${()=>go(k)}><${Ico} n=${i}/><span>${t}</span></button>`)}</nav></header>
 <main class="wrap">${pg==='inicio'?h`<${Home} go=${go} n=${nfb} crit=${crit.length} cls=${cls} tests=${tests}/>`
